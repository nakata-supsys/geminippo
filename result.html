<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        display: flex; 
        align-items: center; 
        justify-content: center; 
        height: 100vh; 
        margin: 0; 
        background: #f8f9fa; /* 常に明るいグレー */
        color: #1c1e21;
      }
      .card { 
        background: #fff; 
        padding: 40px 30px; 
        border-radius: 16px; 
        box-shadow: 0 4px 20px rgba(0,0,0,0.1); 
        text-align: center; 
        max-width: 350px; 
        width: 85%; 
      }
      .icon-box { font-size: 48px; margin-bottom: 15px; }
      h1 { font-size: 18px; margin: 0 0 10px 0; font-weight: bold; }
      p { font-size: 13px; color: #606770; margin: 0 0 25px 0; line-height: 1.5; white-space: pre-line; }
      
      .button { 
        margin-top: 25px; 
        display: inline-block; 
        font-size: 14px; 
        font-weight: bold;
        background: #1a73e8;
        color: #fff;
        text-decoration: none; 
        padding: 12px 24px;
        border-radius: 24px;
        transition: 0.2s;
      }
      .button:hover { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="card" id="result-card" data-redirect-url="<?= appUrl ?>">
      <div class="icon-box"><?= icon ?></div>
      <h1><?= title ?></h1>
      <p><?= message ?></p>
      
      <a href="<?= appUrl ?>" class="button" target="_top">利用を開始する</a>
    </div>
    <script>
      // メッセージ内のURLを自動的にクリック可能なリンクに変換
      document.querySelectorAll('p').forEach(function(el) {
        el.innerHTML = el.innerHTML.replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" style="color:#1a73e8;">$1</a>'
        );
      });
    </script>
  </body>
</html>
