<script>
  let myChart = null;

  function toggleMenu() {
    var menu = document.getElementById('menuDropdown');
    if (menu.classList.contains('show')) { menu.classList.remove('show'); } else { menu.classList.add('show'); }
  }
  
  window.onclick = function(e) {
    if (!e.target.matches('.header-icon') && !e.target.matches('.menu-btn')) {
      var menu = document.getElementById('menuDropdown');
      if (menu && menu.classList.contains('show')) { menu.classList.remove('show'); }
    }
  }

  function toggleDarkModeSwitch() {
    var toggle = document.getElementById('darkModeToggle');
    toggle.checked = !toggle.checked;
    toggleDarkMode();
  }

  function toggleDarkMode() {
    document.body.classList.toggle('dark-mode');
    var isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  }

  (function(){
    if(localStorage.getItem('theme') === 'dark'){
      document.body.classList.add('dark-mode');
      var toggle = document.getElementById('darkModeToggle');
      if(toggle) toggle.checked = true;
    }
  })();

  var loadIv;
  var processId = 0;

  function showLoading(show, customText, allowCancel = false) {
    var overlay = document.getElementById('loading-overlay');
    var text = document.getElementById('loading-text');
    var cancelBtn = document.getElementById('cancel-process-btn');
    
    if (show) {
      overlay.style.display = 'block';
      cancelBtn.style.display = allowCancel ? 'inline-block' : 'none';
      
      if (customText) {
        text.innerText = customText;
        clearInterval(loadIv);
        return;
      }
      text.innerText = "AIが日報を執筆中です...\n(データ収集・生成)";
    } else {
      overlay.style.display = 'none';
      cancelBtn.style.display = 'none';
    }
  }

  function cancelProcess() {
    processId++; 
    showLoading(false);
    Swal.fire({
      icon: 'info',
      title: '中止しました',
      text: '処理を中断しました。',
      timer: 1500,
      showConfirmButton: false
    });
  }

  function switchTab(id) {
    var tabs = document.querySelectorAll('.tab-btn');
    var contents = document.querySelectorAll('.content');
    for(var i=0; i<tabs.length; i++) tabs[i].classList.remove('active');
    for(var i=0; i<contents.length; i++) contents[i].classList.remove('active');
    event.currentTarget.classList.add('active');
    document.getElementById(id).classList.add('active');
  }

  function showResTab(id) {
    document.querySelectorAll('.res-tab-btn').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.res-tab-content').forEach(c=>c.classList.remove('active'));
    document.getElementById('btn-tab-'+id).classList.add('active');
    document.getElementById('res-'+id).classList.add('active');
  }

  function toggleFixedThread(val) {
    var el = document.getElementById('fixedThreadConfig');
    el.style.display = (val === 'fixed_thread') ? 'block' : 'none';
  }

  function toggleTime(show) {
    var el = document.getElementById('timeConfig');
    el.style.display = show ? 'block' : 'none';
  }

  function selectHour(el, h) {
    var chips = document.querySelectorAll('.time-chip');
    for(var i=0; i<chips.length; i++) chips[i].classList.remove('active');
    el.classList.add('active');
    document.getElementById('scheduleHour').value = h;
  }

  function toggleVisibility(id, icon) {
    var input = document.getElementById(id);
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerText = '🔓';
    } else {
      input.type = 'password';
      icon.innerText = '🔒';
    }
  }

  // ★日付のUTCズレ修正用ヘルパー
  function toLocalISOString(date) {
      const y = date.getFullYear();
      const m = ('0' + (date.getMonth() + 1)).slice(-2);
      const d = ('0' + date.getDate()).slice(-2);
      return `${y}-${m}-${d}`;
  }

  function setQuickDate(offset) {
    var d = new Date();
    d.setDate(d.getDate() + offset);
    document.getElementById('manualDate').value = toLocalISOString(d);
  }

  // --- ★提案1: 未保存インジケーター機能 ---
  function setupUnsavedChangesIndicator() {
    const forms = ['connectionForm', 'settingForm', 'promptForm'];
    forms.forEach(formId => {
      const form = document.getElementById(formId);
      if (form) {
        form.addEventListener('input', () => markAsDirty(formId));
      }
    });
  }

  function markAsDirty(formId) {
    let saveButton;
    if (formId === 'connectionForm' || formId === 'settingForm') { // 複数タブにまたがるため、全保存ボタンを対象にする
      saveButton = document.querySelector('#connection .btn-primary') || document.querySelector('#settings .btn-primary');
    } else if (formId === 'promptForm') {
      saveButton = document.querySelector('#prompts .btn-primary');
    }

    if (saveButton && !saveButton.innerText.endsWith('*')) {
      saveButton.innerText += '*';
    }
  }
  // ------------------------------------
  
  // ★提案1の修正: 未保存インジケータークリア機能
  function clearDirtyState(formId) {
    let saveButton;
    if (formId === 'connectionForm' || formId === 'settingForm') {
      document.querySelectorAll('#connection .btn-primary, #settings .btn-primary').forEach(btn => {
        btn.innerText = btn.innerText.replace('*', '');
      });
    } else if (formId === 'promptForm') {
      const btn = document.querySelector('#prompts .btn-primary');
      if (btn) btn.innerText = btn.innerText.replace('*', '');
    }
  }

  function discardDraft() {
    localStorage.removeItem('dailyReportDraft');
    document.getElementById('draftNotice').style.display = 'none';
  }

  function addBacklogRow(data) {
    data = data || {};
    var div = document.createElement('div');
    div.className = 'backlog-row';
    var keyId = 'bl_key_' + Math.random().toString(36).substr(2, 9);
    var hostId = 'bl_host_' + Math.random().toString(36).substr(2, 9);
    
    // ★★★ 修正: 削除時にDirtyマークを付け、UIを更新する ★★★
    var html = '<button type="button" class="remove-btn" onclick="this.parentElement.remove(); markAsDirty(\'connectionForm\'); updateStatusUI();">×</button>';
    html += '<input type="text" class="bl-label" placeholder="ラベル (例: 社内、〇〇様)" value="' + (data.label || '') + '">';
    html += '<input type="text" id="' + hostId + '" class="bl-host" placeholder="ホスト名 (例: g-verse.backlog.jp)" value="' + (data.host || '') + '" style="margin-top:5px;" onblur="cleanHostUrl(this)">';
    html += '<div class="input-wrapper" style="margin-top:5px;">';
    html += '<input type="password" id="' + keyId + '" class="bl-key" placeholder="API Key" value="' + (data.key || '') + '">';
    html += '<span class="toggle-password" onclick="toggleVisibility(\'' + keyId + '\', this)">🔒</span>';
    html += '</div>';
    html += '<button type="button" class="btn-test" onclick="testBacklog(this, \'' + hostId + '\', \'' + keyId + '\')">⚡ 接続テスト</button>';
    div.innerHTML = html;
    document.getElementById('backlog-container').appendChild(div);
    
    // ★★★ 修正: 追加時にもUIを更新する ★★★
    updateStatusUI();
  }

  function cleanHostUrl(input) {
    var val = input.value.trim();
    if (!val) return;
    val = val.replace(/^https?:\/\//, '').replace(/\/$/, '');
    input.value = val;
  }

  function testGemini() {
    var btn = event.currentTarget;
    var originalText = btn.innerHTML;
    btn.innerHTML = '⏳...';
    btn.disabled = true;
    google.script.run.withSuccessHandler(function(res) {
      btn.innerHTML = originalText;
      btn.disabled = false;
      if (res.success) {
        Swal.fire('成功', res.message, 'success');
      } else {
        Swal.fire('失敗', res.message, 'error');
      }
    }).withFailureHandler(function(e) {
      handleFailure(e, btn, originalText);
    }).testGeminiConnection();
  }

  function testSlack() {
    var id = document.getElementById('slackId').value;
    var btn = event.currentTarget;
    var originalText = btn.innerHTML;
    btn.innerHTML = '⏳...';
    btn.disabled = true;
    google.script.run.withSuccessHandler(function(res) {
      btn.innerHTML = originalText;
      btn.disabled = false;
      var icon = document.getElementById('status-slack-post');
      if (res.success) {
        Swal.fire('成功', res.message, 'success');
        icon.classList.add('active');
      } else {
        Swal.fire('失敗', res.message, 'error');
        icon.classList.remove('active');
      }
    }).withFailureHandler(function(e) {
      handleFailure(e, btn, originalText);
    }).testSlackConnection(id);
  }

  function testBacklog(btn, hostId, keyId) {
    var host = document.getElementById(hostId).value;
    var key = document.getElementById(keyId).value;
    if (!host || !key) return Swal.fire('エラー', 'ホスト名とAPIキーを入力してください', 'warning');
    var originalText = btn.innerHTML;
    btn.innerHTML = '⏳...';
    btn.disabled = true;
    google.script.run.withSuccessHandler(function(res) {
      btn.innerHTML = originalText;
      btn.disabled = false;
      if (res.success) {
        Swal.fire('成功', res.message, 'success');
        document.getElementById('status-backlog').classList.add('active');
      } else {
        Swal.fire('失敗', res.message, 'error');
        document.getElementById('status-backlog').classList.remove('active');
      }
    }).withFailureHandler(function(e) {
      handleFailure(e, btn, originalText);
    }).testBacklogConnection(host, key);
  }

  function checkIgnoreIds() {
    var input = document.getElementById('ignoreChannels');
    var ids = input.value;
    if (!ids) return Swal.fire('入力なし', '確認したいIDを入力してください', 'info');

    var btn = event.currentTarget;
    var originalText = btn.innerHTML;
    btn.innerHTML = '🔍 確認中...';
    btn.disabled = true;

    google.script.run.withSuccessHandler(function(res) {
      btn.innerHTML = originalText;
      btn.disabled = false;

      var html = '<div style="text-align:left; font-size:13px; line-height:1.6;">';
      var suggestedIds = [];
      
      res.results.forEach(function(r) {
        var icon = r.valid ? '✅' : '⚠️';
        var color = r.valid ? '#137C04' : '#d93025';
        html += `<div style="margin-bottom:8px; padding-bottom:8px; border-bottom:1px dashed #eee;">
          <span style="color:${color}; font-weight:bold;">${icon} ${r.input}</span><br>
          ${r.message}
        </div>`;
        if (r.suggestion) suggestedIds.push(r.suggestion);
        else if (r.valid) suggestedIds.push(r.input);
      });
      html += '</div>';

      if (suggestedIds.length > 0 && res.hasSuggestion) {
        Swal.fire({
          title: '確認結果',
          html: html,
          icon: 'info',
          showCancelButton: true,
          confirmButtonText: '修正案を反映する',
          cancelButtonText: '閉じる'
        }).then((result) => {
          if (result.isConfirmed) {
            input.value = suggestedIds.join(', ');
            Swal.fire('反映完了', 'IDを正しいものに書き換えました。<br>忘れずに「保存」してください。', 'success');
          }
        });
      } else {
        Swal.fire({ title: '確認結果', html: html });
      }

    }).withFailureHandler(function(e) {
      handleFailure(e, btn, originalText);
    }).checkSlackChannelIds(ids);
  }

  function handleLogout() {
    Swal.fire({
      title: '連携を解除しますか？',
      text: "設定情報はすべて削除され、初期画面に戻ります。",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#d33',
      cancelButtonColor: '#3085d6',
      confirmButtonText: 'はい、解除します',
      cancelButtonText: 'キャンセル'
    }).then(function(result) {
      if (result.isConfirmed) {
        // ★★★ 修正: サーバーサイドでログアウト処理とリダイレクトページ描画を行うため、
        // シンプルなページ遷移に修正
        showLoading(true, "連携を解除しています...");
        
        // サーバー側でログアウト処理を行い、リダイレクト用のページを返してもらう
        // サーバー側で3秒後にトップページに戻るため、クライアント側でのリダイレクトは不要
        window.top.location.href = APP_URL + '?action=logout';
      }
    });
  }

  function openHistory() {
    google.script.run.withSuccessHandler(function(url) {
      if(url) window.open(url, '_blank');
      else Swal.fire('履歴なし', 'まだ履歴シートが作成されていません。\n一度日報を送信すると作成されます。', 'info');
    }).withFailureHandler(function(e) {
      Swal.fire('エラー', '履歴URLの取得に失敗しました: ' + e.message, 'error');
    }).getHistorySheetUrl();
  }

  function saveAllSettings() {
    const data = collectAllSettingsForSave();
    if (!data) return; // バリデーションエラー

    showLoading(true, "設定を保存しています...", false);

      google.script.run.withSuccessHandler(function(res) {
        showLoading(false);
        Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true }).fire({ icon: 'success', title: res.message });
        updateStatusUI(); // UIの状態を更新する
        // Idea 1: Clear the dirty state indicator on successful save.
        clearDirtyState('connectionForm');
        clearDirtyState('settingForm');
      }).withFailureHandler(function(e) {
        showLoading(false);
        Swal.fire('保存エラー', e.message, 'error');
      }).saveUserSettings(data);

  }

  /**
   * 保存用にすべての設定を収集し、バリデーションを行います。
   * @returns {object|null} 設定データオブジェクト、またはバリデーションエラーの場合はnull
   */
  function collectAllSettingsForSave() {
    const data = collectAllSettings();

    if (data.scheduleEnable === 'on' && data.scheduleDays.length === 0) {
      Swal.fire({
        icon: 'warning',
        title: '設定エラー',
        text: '自動実行を設定する場合、曜日を少なくとも1つ選択してください📅',
        confirmButtonColor: '#1a73e8'
      });
      return null;
    }

    // サーバーサイドのsaveUserSettingsが期待するプロパティ名に変換
    const serverData = {
      ...data,
      CALENDAR_IGNORE_WORDS: data.ignoreWords,
      SLACK_IGNORE_CHANNELS: data.ignoreChannels,
      reportDate: data.manualDate,
      // 不要なプロパティを削除
      ignoreWords: undefined,
      ignoreChannels: undefined,
      manualDate: undefined,
      promptSummary: undefined,
      promptDetail: undefined,
      promptManhour: undefined,
      promptReflection: undefined,
      promptAggregation: undefined
    };
    return serverData;
  }

  /**
   * フォームの現在の値に基づいて、UI上のステータスアイコンやバッジを更新します。
   */
  function updateStatusUI() {
    const slackId = document.getElementById('slackId').value;
    document.getElementById('status-slack-post').classList.toggle('active', !!slackId);

    const backlogRowCount = document.querySelectorAll('.backlog-row').length;
    const blBadge = document.getElementById('backlog-badge');
    const blIcon = document.getElementById('status-backlog');
    
    blIcon.classList.toggle('active', backlogRowCount > 0);
    if (backlogRowCount > 0) {
      blBadge.style.display = 'block';
      blBadge.innerText = backlogRowCount;
    } else {
      blBadge.style.display = 'none';
    }
  }

  function validateAndRun() {
    checkDraftAndRun();
  }

  function checkDraftAndRun() {
    var draft = localStorage.getItem('dailyReportDraft');
    if (draft) {
      Swal.fire({ title: '下書きがあります', text: "復元しますか？", icon: 'question', showCancelButton: true, confirmButtonText: '復元', cancelButtonText: '新規作成' }).then(function(res) { if (res.isConfirmed) showPreview(draft, null, null); else runNewReport(); });
    } else {
      runNewReport();
    }
  }

  function runNewReport() {
    showLoading(true, null, true); 
    var dateVal = document.getElementById('manualDate').value; 
    var currentId = ++processId;

    google.script.run.withSuccessHandler(function(res) {
      if (currentId !== processId) return; 
      
      showLoading(false);
      if (res.success) { // Check if the operation was successful
        showPreview(res.report, dateVal, res.counts); 
      } else {
        // If not successful, show an error message
        Swal.fire('エラー', res.message, 'error');
      }
    }).withFailureHandler(function(e) {
      if (currentId !== processId) return;
      showLoading(false);
      Swal.fire('エラー', e.message, 'error');
    }).generatePreviewReport(null, dateVal);
  }

  // --- ★集計機能: 埋め込み表示＆強力パース ---
  function runAggregation() {
    var start = document.getElementById('aggStartDate').value;
    var end = document.getElementById('aggEndDate').value;
    var modelType = document.getElementById('modelType').value;
    var projectList = document.getElementById('projectList').value;

    if(!start || !end) {
        Swal.fire('期間未定', '開始日と終了日を選択してください。', 'warning');
        return;
    }
    if(new Date(start) > new Date(end)) {
        Swal.fire('エラー', '終了日は開始日より後にしてね。', 'error');
        return;
    }

    // ★★★ 修正: プロジェクトリストが空の場合に確認 ★★★
    if (!projectList) {
        Swal.fire({
            title: 'プロジェクト一覧が空です',
            text: "このまま実行も可能ですが、プロジェクト一覧を貼り付けると集計精度が向上します。続行しますか？",
            icon: 'info',
            showCancelButton: true,
            confirmButtonText: 'はい、続行します'
        }).then(result => { if (result.isConfirmed) { doAggregation(start, end, modelType, projectList); } });
    } else {
        doAggregation(start, end, modelType, projectList);
    }
}

function doAggregation(start, end, modelType, projectList) {
    showLoading(true, "集計中... (30〜60秒)", true);
    var pid = ++processId;
    
    // 前回の結果をクリア
    document.getElementById('agg-result-area').style.display = 'none';
    if(window.myChart) { window.myChart.destroy(); window.myChart = null; }

    google.script.run.withSuccessHandler(function(res) {
        if (pid !== processId) return;
        showLoading(false);
        if (res.success) {
            renderAggResult(res.report);
        } else {
            Swal.fire('失敗', res.message, 'error');
        }
    }).withFailureHandler(function(e) {
        showLoading(false);
        Swal.fire('エラー', e.message, 'error');
    }).runPeriodAggregation(start, end, modelType, projectList);
}

  function renderAggResult(fullText) {
    console.log("Raw Response:", fullText);

    // 1. JSON抽出 (かなり緩く探す)
    var jsonMatch = fullText.match(/```(?:json)?\s*(\[\s*\{[\s\S]*?\}\s*\])\s*```/);
    if (!jsonMatch) {
          // コードブロックがない場合、直書きのJSON配列を探す
          jsonMatch = fullText.match(/(\[\s*\{[\s\S]*?\}\s*\])/);
    }

    var chartData = null;
    var summaryText = fullText;

    if (jsonMatch && jsonMatch[1]) {
        try {
            chartData = JSON.parse(jsonMatch[1]);
            // 本文からJSON部分を削除して見やすくする
            summaryText = fullText.replace(jsonMatch[0], '');
        } catch(e) {
            console.error("JSON Parse Error:", e);
        }
    }

    // 2. 日別データの分割
    var splitKey = "📅 **日別";
    if (summaryText.indexOf(splitKey) === -1) {
          // 表記揺れ対策
          if (summaryText.indexOf("📅 日別") !== -1) splitKey = "📅 日別";
          else if (summaryText.indexOf("-------") !== -1) splitKey = "-------";
    }

    var dailyText = "";
    var parts = summaryText.split(splitKey);
    
    if (parts.length > 1) {
        summaryText = parts[0];
        dailyText = splitKey + parts.slice(1).join(splitKey);
    } else {
        // 分割できなくても空にせず、全部表示する（安全策）
        dailyText = summaryText; // summaryTextにはJSONを除いたテキストが入っている
        summaryText = "(※サマリの自動整形に失敗しました。日別タブで全文を確認してください)";
    }

    // 3. 表示実行
    document.getElementById('aggSummaryText').innerHTML = marked.parse(summaryText);
    document.getElementById('aggDailyText').innerHTML = marked.parse(dailyText);
    window.lastAggText = dailyText;

    // ★修正: 結果エリアを表示し、強制的に「日別データ」タブをアクティブにする
    var resArea = document.getElementById('agg-result-area');
    resArea.style.display = 'block';
    
    // ★ここを変更: 強制的に「日別」タブをクリックさせる
    document.getElementById('btn-tab-daily').click();

    // グラフ描画
    if (chartData) {
        setTimeout(function(){ renderAggChart(chartData); }, 200);
    } else {
        document.getElementById('aggChart').style.display = 'none';
    }
    
    // スクロール
    setTimeout(function(){ resArea.scrollIntoView({behavior:'smooth', block:'start'}); }, 300);
  }

  function renderAggChart(data) {
    var ctx = document.getElementById('aggChart').getContext('2d');
    var labels = data.map(function(d){ return d.label; });
    var values = data.map(function(d){ return d.hours; });
    var colors = ['#4F46E5', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6', '#6B7280', '#EC4899', '#6366F1'];

    if (window.myChart) { window.myChart.destroy(); }
    document.getElementById('aggChart').style.display = 'block';

    window.myChart = new Chart(ctx, {
        // ★修正: クリックイベントを追加
        onClick: (evt, elements) => {
            if (elements.length > 0) {
                const clickedLabel = labels[elements[0].index];
                // 日別データタブに切り替え
                document.getElementById('btn-tab-daily').click();
                // 該当プロジェクトをハイライト
                highlightProjectInData(clickedLabel);
            }
        },
        onHover: (evt, elements) => {
            evt.native.target.style.cursor = elements.length > 0 ? 'pointer' : 'default';
        },
        type: 'doughnut',
        data: {
            labels: labels,
            datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
                legend: { 
                    position: 'right', 
                    labels: { boxWidth: 12, font: { size: 10 } } 
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.label + ': ' + context.raw + 'h';
                        }
                    }
                }
            }
        }
    });
  }

  /**
   * 日別データ内の特定のプロジェクト行をハイライトします。
   * @param {string} projectName ハイライトするプロジェクト名
   */
  function highlightProjectInData(projectName) {
      const dailyContainer = document.getElementById('aggDailyText');
      // 既存のハイライトをすべて解除
      dailyContainer.querySelectorAll('li').forEach(li => li.style.backgroundColor = '');

      // 該当するプロジェクト名を含むli要素を探してハイライト
      dailyContainer.querySelectorAll('li').forEach(li => {
          if (li.textContent.includes(`[${projectName}]`)) {
              li.style.backgroundColor = 'var(--highlight)';
          }
      });
  }

  window.copyDailyResult = function() {
      var txt = window.lastAggText || "";

  // --- ★提案3: 設定のインポート/エクスポート ---
  function collectAllSettings() {
    const form = document.getElementById('connectionForm');
    const settingsForm = document.getElementById('settingForm');
    const promptForm = document.getElementById('promptForm');

    const formData = new FormData(form);
    const settingsFormData = new FormData(settingsForm);
    for (const [key, value] of settingsFormData.entries()) { formData.append(key, value); }
    const promptFormData = new FormData(promptForm);
    for (const [key, value] of promptFormData.entries()) { formData.append(key, value); }

    const data = Object.fromEntries(formData.entries());

    // Checkboxes and other manual data
    data.scheduleEnable = document.querySelector('input[name="scheduleEnable"]:checked')?.value || 'off';
    data.scheduleDays = Array.from(document.querySelectorAll('.day-checkbox:checked')).map(cb => cb.value);
    data.skipHolidays = document.getElementById('skipHolidays').checked;

    const blConfigs = [];
    document.querySelectorAll('.backlog-row').forEach(row => {
      blConfigs.push({
        label: row.querySelector('.bl-label').value,
        host: row.querySelector('.bl-host').value,
        key: row.querySelector('.bl-key').value
      });
    });
    data.backlogConfigs = blConfigs;

    return data;
  }

  function exportSettings() {
      const data = collectAllSettings();
      const jsonString = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'geminippo-settings.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
  }

  function importSettings() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = readerEvent => {
              try {
                  const content = readerEvent.target.result;
                  const settings = JSON.parse(content);
                  applySettingsToForm(settings);
                  Swal.fire('インポート完了', '設定をフォームに反映しました。\n内容を確認し、問題なければ各タブで「保存」してください。', 'success');
              } catch (err) {
                  Swal.fire('インポート失敗', 'ファイルの形式が正しくないか、読み込みに失敗しました。', 'error');
              }
          };
          reader.readAsText(file, 'UTF-8');
      };
      input.click();
  }

  function applySettingsToForm(settings) {
    // この関数は、settingsオブジェクトのキーと値を使って、各フォーム要素に値を設定するロジックを実装します。
    // 例: document.getElementById('slackId').value = settings.slackId;
    // ★★★ 修正: 汎用的なフォーム適用ロジックに改善 ★★★
    Object.keys(settings).forEach(key => {
      const value = settings[key];
      const el = document.getElementById(key) || document.querySelector(`[name="${key}"]`);

      if (!el) return;

      if (el.type === 'checkbox') {
        el.checked = !!value;
      } else if (el.type === 'radio') {
        // name属性でラジオボタングループを探して、該当するvalueを持つものをチェック
        document.querySelectorAll(`input[name="${key}"]`).forEach(rb => {
          rb.checked = (rb.value === String(value));
        });
      } else {
        el.value = value;
      }
    });

    // スケジュール有効/無効
    if (settings.scheduleEnable) {
      const radio = document.querySelector(`input[name="scheduleEnable"][value="${settings.scheduleEnable}"]`);
      if(radio) {
        radio.checked = true;
        toggleTime(settings.scheduleEnable === 'on');
      }
    }
    // 曜日
    document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = false);
    if (settings.scheduleDays && Array.isArray(settings.scheduleDays)) {
      settings.scheduleDays.forEach(day => {
        const cb = document.getElementById(`day_${day}`);
        if (cb) cb.checked = true;
      });
    }

    if (settings.backlogConfigs && Array.isArray(settings.backlogConfigs)) {
        document.getElementById('backlog-container').innerHTML = '';
        settings.backlogConfigs.forEach(c => addBacklogRow(c));
    }

    // UIステータスを更新
    // This call ensures the UI reflects the imported settings immediately.
    updateStatusUI();
    // 全てのフォーム要素に対してこの処理を行う必要があります。
  }
