<script>
  let myChart = null;
  let promptDetailCache = '';
  let latestTodoMessage = '';
  let todoReminderStateMap = {};
  if (typeof marked !== 'undefined' && marked && typeof marked.use === 'function') {
    marked.use({
      renderer: {
        link: function(linkArg) {
          var href = linkArg && linkArg.href ? linkArg.href : '';
          var title = linkArg && linkArg.title ? linkArg.title : '';
          var tokens = linkArg && linkArg.tokens ? linkArg.tokens : [];
          var text = this.parser.parseInline(tokens);
          var safeTitle = title ? ' title="' + escapeAttr(title) + '"' : '';
          return '<a href="' + escapeAttr(href || '') + '" target="_blank" rel="noopener noreferrer"' + safeTitle + '>' + text + '</a>';
        }
      }
    });
  }

  // =============================================
  // UI Event Handlers
  // =============================================

  /**
   * メインのタブを切り替えます。
   * @param {string} id 表示するコンテンツのID
   * @param {Event} [evt] クリックイベント（GASサンドボックスで global event が使えない場合用）
   */
  function hasUnsavedChanges_() {
    const connectionDirty = Array.from(document.querySelectorAll('#connection .btn-primary, #settings .btn-primary, #reportSettingsMount .btn-primary'))
      .some(function(btn) { return (btn && btn.innerText || '').trim().endsWith('*'); });
    const promptBtn = document.querySelector('#prompts .btn-primary');
    const promptDirty = !!(promptBtn && (promptBtn.innerText || '').trim().endsWith('*'));
    const summaryBtn = document.getElementById('summarySaveBtn');
    const summaryDirty = !!(summaryBtn && (summaryBtn.innerText || '').trim().endsWith('*'));
    return connectionDirty || promptDirty || summaryDirty;
  }

  function clearAllDirtyState_() {
    clearDirtyState('connectionForm');
    clearDirtyState('settingForm');
    clearDirtyState('promptForm');
    clearDirtyState('summaryForm');
  }

  function performSwitchTab_(id, evt) {
    document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.content').forEach(content => content.classList.remove('active'));
    if (id !== 'admin') {
      document.querySelectorAll('.settings-content').forEach(content => content.classList.remove('active'));
      document.querySelectorAll('.settings-tab-btn[data-admin-tab]').forEach(btn => btn.classList.remove('active'));
    }
    const e = evt || (typeof event !== 'undefined' ? event : null);
    if (e && e.currentTarget) {
      e.currentTarget.classList.add('active');
    } else {
      var btn = document.querySelector('.tab-btn[data-tab="' + id + '"]');
      if (btn) btn.classList.add('active');
    }
    var el = document.getElementById(id);
    if (el) el.classList.add('active');
    if (id === 'admin') performSwitchAdminTab_('connection');
  }

  window.switchTab = function(id, evt) {
    const currentTabEl = document.querySelector('.tab-btn[data-tab].active');
    const currentTab = currentTabEl ? currentTabEl.getAttribute('data-tab') : null;
    if (currentTab === id) return;
    if (!hasUnsavedChanges_()) {
      performSwitchTab_(id, evt);
      return;
    }
    Swal.fire({
      icon: 'warning',
      title: '未保存の変更があります',
      text: '保存せずにタブを切り替えますか？',
      showCancelButton: true,
      confirmButtonText: '切り替える',
      cancelButtonText: 'このまま編集する'
    }).then(function(result) {
      if (result.isConfirmed) {
        clearAllDirtyState_();
        performSwitchTab_(id, evt);
      }
    });
  };

  function performSwitchAdminTab_(id, evt) {
    document.querySelectorAll('.settings-tab-btn[data-admin-tab]').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.settings-content').forEach(content => content.classList.remove('active'));
    const e = evt || (typeof event !== 'undefined' ? event : null);
    if (e && e.currentTarget) {
      e.currentTarget.classList.add('active');
    } else {
      var btn = document.querySelector('.settings-tab-btn[data-admin-tab="' + id + '"]');
      if (btn) btn.classList.add('active');
    }
    var el = document.getElementById(id);
    if (el) el.classList.add('active');
  }

  window.switchAdminTab = function(id, evt) {
    const currentAdminTabEl = document.querySelector('.settings-tab-btn[data-admin-tab].active');
    const currentTab = currentAdminTabEl ? currentAdminTabEl.getAttribute('data-admin-tab') : null;
    if (currentTab === id) return;
    if (!hasUnsavedChanges_()) {
      performSwitchAdminTab_(id, evt);
      return;
    }
    Swal.fire({
      icon: 'warning',
      title: '未保存の変更があります',
      text: '保存せずに設定タブを切り替えますか？',
      showCancelButton: true,
      confirmButtonText: '切り替える',
      cancelButtonText: 'このまま編集する'
    }).then(function(result) {
      if (result.isConfirmed) {
        clearAllDirtyState_();
        performSwitchAdminTab_(id, evt);
      }
    });
  };

  window.toggleMenu = function() {
    const menu = document.getElementById('menuDropdown');
    if (menu.classList.contains('show')) { menu.classList.remove('show'); } else { menu.classList.add('show'); }
  }
  
  window.onclick = function(e) {
    if (!e.target.matches('.header-icon') && !e.target.matches('.menu-btn')) {
      var menu = document.getElementById('menuDropdown');
      if (menu && menu.classList.contains('show')) { menu.classList.remove('show'); }
    }
  }

  window.toggleDarkModeSwitch = function() {
    var toggle = document.getElementById('darkModeToggle');
    toggle.checked = !toggle.checked;
    toggleDarkMode();
  }

  window.toggleDarkMode = function() {
    document.body.classList.toggle('dark-mode');
    var isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  };

  (function(){
    if(localStorage.getItem('theme') === 'dark'){
      document.body.classList.add('dark-mode');
      var toggle = document.getElementById('darkModeToggle');
      if(toggle) toggle.checked = true;
    }
  })();

  var loadIv;
  var processId = 0;

  window.showLoading = function(show, customText, allowCancel = false) {
    var overlay = document.getElementById('loading-overlay');
    var text = document.getElementById('loading-text');
    var cancelBtn = document.getElementById('cancel-process-btn');
    
    if (show) {
      overlay.style.display = 'block';
      cancelBtn.style.display = allowCancel ? 'inline-block' : 'none';
      
      if (customText) {
        text.innerText = customText;
        clearInterval(loadIv);
        return;
      }
      text.innerText = "AIが日報を執筆中です...\n(データ収集・生成)";
    } else {
      overlay.style.display = 'none';
      cancelBtn.style.display = 'none';
    }
  }

  window.cancelProcess = function() {
    processId++; 
    showLoading(false);
    Swal.fire({
      icon: 'info',
      title: '中止しました',
      text: '処理を中断しました。',
      timer: 1500,
      showConfirmButton: false
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeAttr(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showNetworkError(error, title) {
    const detail = error && error.message ? `\n\n詳細: ${error.message}` : '';
    Swal.fire({
      icon: 'error',
      title: title || '通信エラーが発生しました',
      text: '通信環境や連携先サービスの応答に時間がかかっている可能性があります。しばらく時間をおいてから再度お試しください。' + detail
    });
  }

  function showErrorOrNetwork(title, error) {
    if (error && error.message && error.message.indexOf('外部サービスからの応答を確認できませんでした') !== -1) {
      showNetworkError(error, title);
    } else {
      Swal.fire(title || 'エラー', error && error.message ? error.message : '不明なエラーが発生しました', 'error');
    }
  }

  /**
   * 結果表示エリアのタブを切り替えます。
   * @param {string} id 'daily' または 'summary'
   */
  window.showResTab = function(id) {
    document.querySelectorAll('.res-tab-btn').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.res-tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('btn-tab-' + id).classList.add('active');
    document.getElementById('res-' + id).classList.add('active');
  }

  var summaryClientDefs = [];
  var summaryClientCounter = 0;
  var summaryUiStateByClientId = {};
  var summarySlackDisplayNames = {};
  var summaryBacklogDisplayNames = {};
  var summarySelectedClientIds = [];

  function nextSummaryClientId_() {
    summaryClientCounter += 1;
    return 'sc_' + new Date().getTime() + '_' + summaryClientCounter;
  }

  function normalizeSummaryClientDefs_(rules) {
    var rows = [];
    var i;
    if (!rules || !rules.length) return rows;
    for (i = 0; i < rules.length; i++) {
      var rule = rules[i] || {};
      var id = String(rule.id || ('sc_' + (i + 1))).replace(/^\s+|\s+$/g, '');
      var slackChannels = rule.slackChannels && rule.slackChannels.length ? rule.slackChannels : [];
      var backlogKeys = rule.backlogKeys && rule.backlogKeys.length ? rule.backlogKeys : [];
      rows.push({
        id: id || nextSummaryClientId_(),
        name: String(rule.name || '').replace(/^\s+|\s+$/g, ''),
        slackChannels: normalizeSummaryStringList_(slackChannels, false),
        backlogKeys: normalizeSummaryStringList_(backlogKeys, true),
        updatedAt: String(rule.updatedAt || '')
      });
    }
    return rows;
  }

  function normalizeSummaryStringList_(values, upperCase) {
    var out = [];
    var seen = {};
    var i;
    for (i = 0; i < values.length; i++) {
      var val = String(values[i] || '').replace(/^\s+|\s+$/g, '');
      if (upperCase) val = val.toUpperCase();
      if (!val || seen[val]) continue;
      seen[val] = true;
      out.push(val);
    }
    return out;
  }

  function parseSummaryRulesFromHidden_() {
    var hidden = document.getElementById('summaryClientRules');
    var raw;
    var decoded;
    if (!hidden) return [];
    try {
      raw = hidden.value || '[]';
      decoded = raw;
      if (decoded && decoded.indexOf('&') !== -1) {
        decoded = decoded
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&amp;/g, '&');
      }
      return normalizeSummaryClientDefs_(JSON.parse(decoded || '[]'));
    } catch (e) {
      console.warn('Failed to parse summary rules:', e);
      return [];
    }
  }

  function parseSummarySelectedClientIds_() {
    var hidden = document.getElementById('summarySelectedClientIds');
    var raw;
    var decoded;
    var arr;
    var out = [];
    var seen = {};
    var i;
    if (!hidden) return [];
    try {
      raw = hidden.value || '[]';
      decoded = raw;
      if (decoded && decoded.indexOf('&') !== -1) {
        decoded = decoded
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .replace(/&lt;/g, '<')
          .replace(/&gt;/g, '>')
          .replace(/&amp;/g, '&');
      }
      arr = JSON.parse(decoded || '[]');
      if (!Array.isArray(arr)) return [];
      for (i = 0; i < arr.length; i++) {
        var id = String(arr[i] || '').replace(/^\s+|\s+$/g, '');
        if (!id || seen[id]) continue;
        seen[id] = true;
        out.push(id);
      }
      return out;
    } catch (e) {
      return [];
    }
  }

  function applySummarySelectedClientIds_(select) {
    var selectedMap = {};
    var i;
    if (!select) return;
    for (i = 0; i < summarySelectedClientIds.length; i++) selectedMap[summarySelectedClientIds[i]] = true;
    for (i = 0; i < select.options.length; i++) {
      select.options[i].selected = !!selectedMap[select.options[i].value];
    }
    enforceSummarySelectLimit_(select);
  }

  function getCurrentSummarySelectedClientIds_() {
    var select = document.getElementById('summaryClientSelect');
    var ids = [];
    var i;
    if (!select) return ids;
    for (i = 0; i < select.options.length; i++) {
      if (select.options[i].selected) ids.push(select.options[i].value);
    }
    return ids;
  }

  function persistSummarySelectedClientIds_() {
    var ids = getCurrentSummarySelectedClientIds_();
    summarySelectedClientIds = ids.slice(0);
    var hidden = document.getElementById('summarySelectedClientIds');
    if (hidden) hidden.value = JSON.stringify(summarySelectedClientIds);
    google.script.run.withFailureHandler(function() {}).saveSummarySelectedClientIds(summarySelectedClientIds);
  }

  function getSummaryTagValues_(container) {
    var vals = [];
    var pills;
    var i;
    if (!container) return vals;
    pills = container.querySelectorAll('.tag-pill');
    for (i = 0; i < pills.length; i++) {
      var raw = pills[i].getAttribute('data-value');
      var text = String(raw || pills[i].textContent || '').replace('×', '').replace(/^\s+|\s+$/g, '');
      if (text) vals.push(text);
    }
    return vals;
  }

  function getSummarySlackTagDisplay_(value) {
    var key = String(value || '').replace(/^\s+|\s+$/g, '');
    var disp = summarySlackDisplayNames[key] || '';
    return disp ? (disp + ' (' + key + ')') : key;
  }

  function getSummaryBacklogTagDisplay_(value) {
    var key = String(value || '').replace(/^\s+|\s+$/g, '');
    var name = summaryBacklogDisplayNames[key] || '';
    return name ? (name + ' (' + key + ')') : key;
  }

  function normalizeSummarySlackChannelId_(value) {
    var raw = String(value || '').replace(/^\s+|\s+$/g, '');
    var m;
    if (!raw) return '';
    m = raw.match(/\/archives\/([CDG][A-Z0-9]+)/i);
    if (m && m[1]) return m[1].toUpperCase();
    m = raw.match(/[?&]channel=([CDG][A-Z0-9]+)/i);
    if (m && m[1]) return m[1].toUpperCase();
    return raw;
  }

  function preloadSummarySlackNames_() {
    var ids = [];
    var seen = {};
    var i;
    var j;
    for (i = 0; i < summaryClientDefs.length; i++) {
      var arr = summaryClientDefs[i].slackChannels || [];
      for (j = 0; j < arr.length; j++) {
        var id = String(arr[j] || '').replace(/^\s+|\s+$/g, '');
        if (!id || seen[id]) continue;
        seen[id] = true;
        ids.push(id);
      }
    }
    if (!ids.length) return;
    google.script.run.withSuccessHandler(function(res) {
      var names = (res && res.names) || {};
      var changed = false;
      for (var key in names) {
        if (!Object.prototype.hasOwnProperty.call(names, key)) continue;
        if (summarySlackDisplayNames[key] !== names[key]) {
          summarySlackDisplayNames[key] = names[key];
          changed = true;
        }
      }
      if (changed) renderSummaryClientList_();
    }).withFailureHandler(function() {}).resolveSummarySlackChannelNames(ids);
  }

  function preloadSummaryBacklogNames_() {
    var keys = [];
    var seen = {};
    var i;
    var j;
    for (i = 0; i < summaryClientDefs.length; i++) {
      var arr = summaryClientDefs[i].backlogKeys || [];
      for (j = 0; j < arr.length; j++) {
        var key = String(arr[j] || '').replace(/^\s+|\s+$/g, '');
        if (!key || seen[key]) continue;
        seen[key] = true;
        keys.push(key);
      }
    }
    if (!keys.length) return;
    google.script.run.withSuccessHandler(function(res) {
      var names = (res && res.names) || {};
      var changed = false;
      for (var key in names) {
        if (!Object.prototype.hasOwnProperty.call(names, key)) continue;
        if (summaryBacklogDisplayNames[key] !== names[key]) {
          summaryBacklogDisplayNames[key] = names[key];
          changed = true;
        }
      }
      if (changed) renderSummaryClientList_();
    }).withFailureHandler(function() {}).resolveSummaryBacklogProjectNames(keys);
  }

  function buildSummaryTagInput_(label, className, values, placeholder, rowId, helpKey) {
    var html = '';
    var i;
    html += '<div style="margin-bottom:8px;">';
    html += '<label style="font-size:0.8rem; color:var(--sub-text);" title="カンマまたはEnterで複数追加できます。">' + escapeHtml(label);
    if (helpKey) html += ' <span class="help-icon" data-help="' + escapeAttr(helpKey) + '">?</span>';
    html += '</label>';
    html += '<div class="tag-input-container ' + escapeAttr(className) + '" data-row="' + escapeAttr(rowId) + '">';
    for (i = 0; i < values.length; i++) {
      var raw = String(values[i] || '').replace(/^\s+|\s+$/g, '');
      var label = raw;
      if (className.indexOf('summary-slack-tags') !== -1) label = getSummarySlackTagDisplay_(raw);
      if (className.indexOf('summary-backlog-tags') !== -1) label = getSummaryBacklogTagDisplay_(raw);
      html += '<span class="tag-pill" data-value="' + escapeAttr(raw) + '">' + escapeHtml(label) +
        '<button type="button" onclick="removeSummaryTagPill(this)">×</button></span>';
    }
    html += '<input type="text" class="tag-input-field" title="サンプル形式で入力してください。URL貼り付けにも対応しています。" placeholder="' + escapeAttr(placeholder) +
      '" onkeydown="handleSummaryTagInputKey(event, this)" onblur="commitSummaryTagInput(this)">';
    html += '</div></div>';
    return html;
  }

  function updateSummaryClientCountBadge_() {
    var badge = document.getElementById('summaryClientCountBadge');
    if (!badge) return;
    badge.textContent = '全' + summaryClientDefs.length + '件';
  }

  function renderSummaryClientSelect_() {
    var select = document.getElementById('summaryClientSelect');
    var selected = {};
    var i;
    var html = '';
    if (!select) return;
    for (i = 0; i < select.options.length; i++) {
      if (select.options[i].selected) selected[select.options[i].value] = true;
    }
    for (i = 0; i < summaryClientDefs.length; i++) {
      var rule = summaryClientDefs[i];
      html += '<option value="' + escapeAttr(rule.id) + '">' +
        escapeHtml(rule.name || '（名称未設定）') +
        ' （Slack:' + rule.slackChannels.length + ' / Backlog:' + rule.backlogKeys.length + '）</option>';
    }
    select.innerHTML = html;
    for (i = 0; i < select.options.length; i++) if (selected[select.options[i].value]) select.options[i].selected = true;
    applySummarySelectedClientIds_(select);
    if (!select.dataset.summaryClickBound) {
      select.addEventListener('mousedown', function(e) {
        var target = e.target;
        var selectedCount = 0;
        var k;
        if (!target || target.tagName !== 'OPTION') return;
        e.preventDefault();
        if (target.selected) {
          target.selected = false;
          persistSummarySelectedClientIds_();
          return;
        }
        for (k = 0; k < select.options.length; k++) {
          if (select.options[k].selected) selectedCount += 1;
        }
        if (selectedCount >= 10) {
          Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2200 })
            .fire({ icon: 'info', title: '選択できるのは10件までです。' });
          return;
        }
        target.selected = true;
        persistSummarySelectedClientIds_();
      });
      select.dataset.summaryClickBound = '1';
    }
    enforceSummarySelectLimit_(select);
    renderSummaryClientCheckboxList_();
  }

  function renderSummaryClientCheckboxList_() {
    var root = document.getElementById('summaryClientCheckboxList');
    var select = document.getElementById('summaryClientSelect');
    var html = '';
    var i;
    var selected = {};
    if (!root || !select) return;
    for (i = 0; i < select.options.length; i++) {
      if (select.options[i].selected) selected[select.options[i].value] = true;
    }
    for (i = 0; i < summaryClientDefs.length; i++) {
      var rule = summaryClientDefs[i];
      html += '<label class="checkbox-wrapper" style="margin:0; padding:8px 10px; border:1px solid var(--border-color); border-radius:8px;">' +
        '<input type="checkbox" data-summary-client-id="' + escapeAttr(rule.id) + '"' + (selected[rule.id] ? ' checked' : '') +
        ' onchange="toggleSummaryClientSelection_(this)">' +
        '<span style="margin-left:8px;">' + escapeHtml(rule.name || '（名称未入力）') +
        ' <span style="font-size:11px; color:var(--sub-text);">Slack:' + rule.slackChannels.length + ' / Backlog:' + rule.backlogKeys.length + '</span></span></label>';
    }
    root.innerHTML = html || '<div style="font-size:12px; color:var(--sub-text);">対象クライアントがありません。サマリ設定で追加してください。</div>';
    updateSummaryClientSelectCountBadge_();
    applySummaryClientSelectDefaultCollapse_();
  }

  function updateSummaryClientSelectCountBadge_() {
    var badge = document.getElementById('summaryClientSelectCountBadge');
    var select = document.getElementById('summaryClientSelect');
    var total = summaryClientDefs.length;
    var selected = 0;
    var i;
    if (!badge || !select) return;
    for (i = 0; i < select.options.length; i++) {
      if (select.options[i].selected) selected += 1;
    }
    badge.textContent = '（選択' + selected + ' / 全' + total + '）';
  }

  function applySummaryClientSelectDefaultCollapse_() {
    var details = document.getElementById('summaryTargetClientsDetails');
    if (!details) return;
    if (!details.dataset.collapseInitialized) {
      details.open = summaryClientDefs.length <= 5;
      details.dataset.collapseInitialized = '1';
    }
  }

  window.toggleSummaryClientSelection_ = function(checkbox) {
    var id = checkbox ? checkbox.getAttribute('data-summary-client-id') : '';
    var select = document.getElementById('summaryClientSelect');
    var i;
    var selectedCount = 0;
    if (!id || !select) return;
    for (i = 0; i < select.options.length; i++) {
      if (select.options[i].selected) selectedCount += 1;
    }
    if (checkbox.checked && selectedCount >= 10) {
      checkbox.checked = false;
      Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 2200 })
        .fire({ icon: 'info', title: '選択できるのは10件までです。' });
      return;
    }
    for (i = 0; i < select.options.length; i++) {
      if (select.options[i].value === id) {
        select.options[i].selected = !!checkbox.checked;
        break;
      }
    }
    updateSummaryClientSelectCountBadge_();
    persistSummarySelectedClientIds_();
  };

  function renderSummaryClientList_() {
    var container = document.getElementById('summaryClientList');
    var html = '';
    var i;
    if (!container) return;
    for (i = 0; i < summaryClientDefs.length; i++) {
      var rule = summaryClientDefs[i];
      html += buildSummaryClientRowHtml_(rule);
    }
    if (!html) {
      html = '<div style="font-size:12px; color:var(--sub-text); border:1px dashed var(--border-color); border-radius:10px; padding:10px;">まだクライアントがありません。まず「＋ クライアントを追加」から登録してください。</div>';
    }
    container.innerHTML = html;
    if (typeof tippy !== 'undefined') {
      tippy(container.querySelectorAll('.help-icon'), {
        content: function(reference) {
          var key = reference.getAttribute('data-help');
          if (key === 'summarySlackTags') return '複数指定できます。Enter または , で追加します。<br>チャンネルIDとURLのどちらでも入力できます。';
          if (key === 'summaryBacklogTags') return '複数指定できます。Enter または , で追加します。<br>プロジェクトキーとURLのどちらでも入力できます。';
          return 'ヘルプ';
        },
        allowHTML: true,
        animation: 'shift-away',
        interactive: true,
        maxWidth: 420
      });

  function serializeSummaryClientDefs_() {
    var rows = document.querySelectorAll('#summaryClientList .alias-rule-row');
    var updated = {};
    var defs = [];
    var i;
    for (i = 0; i < rows.length; i++) {
      var row = rows[i];
      var id = row.getAttribute('data-client-id') || nextSummaryClientId_();
      var nameEl = row.querySelector('.summary-client-name');
      var name = nameEl ? String(nameEl.value || '').replace(/^\s+|\s+$/g, '') : '';
      updated[id] = {
        id: id,
        name: name,
        slackChannels: getSummaryTagValues_(row.querySelector('.summary-slack-tags')),
        backlogKeys: normalizeSummaryStringList_(getSummaryTagValues_(row.querySelector('.summary-backlog-tags')), true),
        updatedAt: new Date().toISOString()
      };
    }
    for (i = 0; i < summaryClientDefs.length; i++) {
      var existing = summaryClientDefs[i];
      defs.push(updated[existing.id] || existing);
      delete updated[existing.id];
    }
    for (var key in updated) {
      if (Object.prototype.hasOwnProperty.call(updated, key)) defs.push(updated[key]);
    }
    summaryClientDefs = [];
    for (i = 0; i < defs.length; i++) summaryClientDefs.push(defs[i]);
    var hidden = document.getElementById('summaryClientRules');
    if (hidden) hidden.value = JSON.stringify(summaryClientDefs);
    renderSummaryClientSelect_();
    updateSummaryClientCountBadge_();
    return summaryClientDefs;
  }

  window.handleSummaryTagInputKey = function(e, input) {

  window.commitSummaryTagInput = function(input) {
    var val;
    var tagContainer;
    var existing;
    var normalized;
    var pill;
    if (!input) return;
    val = String(input.value || '').replace(/,/g, '').replace(/^\s+|\s+$/g, '');
    if (!val) return;
    tagContainer = input.parentElement;
    existing = getSummaryTagValues_(tagContainer);
    if (tagContainer.classList.contains('summary-backlog-tags')) normalized = normalizeSummaryBacklogKey_(val);
    else if (tagContainer.classList.contains('summary-slack-tags')) normalized = normalizeSummarySlackChannelId_(val);
    else normalized = val;
    if (existing.indexOf(normalized) !== -1) {
      input.value = '';
      return;
    }
    pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.setAttribute('data-value', normalized);
    var display = normalized;
    if (tagContainer.classList.contains('summary-slack-tags')) display = getSummarySlackTagDisplay_(normalized);
    if (tagContainer.classList.contains('summary-backlog-tags')) display = getSummaryBacklogTagDisplay_(normalized);
    pill.innerHTML = escapeHtml(display) + '<button type="button" onclick="removeSummaryTagPill(this)">×</button>';
    tagContainer.insertBefore(pill, input);
    input.value = '';
    markSummaryDirty_();
    serializeSummaryClientDefs_();
  };

  window.removeSummaryTagPill = function(btn) {
    if (!btn || !btn.parentElement) return;
    btn.parentElement.remove();
    markSummaryDirty_();
    serializeSummaryClientDefs_();
  };

  function normalizeSummaryBacklogKey_(value) {
    var val = String(value || '').replace(/^\s+|\s+$/g, '');
    var match;
    if (!val) return '';
    match = val.match(/\/projects\/([A-Za-z0-9_-]+)/i);
    if (match && match[1]) return match[1].toUpperCase();
    match = val.match(/\/view\/([A-Za-z0-9_-]+)-\d+/i);
    if (match && match[1]) return match[1].toUpperCase();
    return val.toUpperCase();
  }

  function renderSummaryResult_(res) {
    var root = document.getElementById('summaryResultArea');
    var html = '';
    var summaries = (res && res.summaries) || [];
    var showEvidence = !!(res && res.showEvidence);
    var i;
    if (!root) return;
    for (i = 0; i < summaries.length; i++) {
      var item = summaries[i];
      var evidence = Array.isArray(item.evidence) ? item.evidence : [];
      var statusLabel = '';
      if (item.status === 'error') statusLabel = ' <span style="font-size:11px; color:#ff8a8a;">（一部失敗）</span>';
      if (item.status === 'no_activity') statusLabel = ' <span style="font-size:11px; color:var(--sub-text);">（更新なし）</span>';
      html += '<details class="group" open>';
      html += '<summary style="cursor:pointer; font-weight:bold; font-size:14px;">' +
        escapeHtml(item.clientName || '') + ' <span style="font-size:11px; color:var(--sub-text);">（' +
        escapeHtml(String(item.activityCount || 0)) + '件）</span>' + statusLabel + '</summary>';
      html += '<div class="summary-plain-body" style="margin-top:10px;">' +
        renderSummaryPlainReport_(item.report || '') + '</div>';
      if (showEvidence) {
        html += '<div style="margin-top:12px; border-top:1px solid var(--line); padding-top:10px;">';
        html += '<details style="margin-top:4px;">';
        html += '<summary style="cursor:pointer; font-size:12px; font-weight:700; color:var(--sub-text);">根拠データを表示（' + escapeHtml(String(evidence.length || 0)) + '件）</summary>';
        html += '<div style="margin-top:8px;">';
        if (evidence.length === 0) {
          html += '<div style="font-size:12px; color:var(--sub-text);">表示できる根拠はありません。</div>';
        } else {
          html += '<div style="display:flex; flex-direction:column; gap:8px;">';
          evidence.forEach(function(ev) {
            var source = escapeHtml(ev.source || '');
            var timestamp = escapeHtml(ev.timestampJst || '');
            var label = escapeHtml(ev.label || '');
            var text = escapeHtml(ev.text || '');
            var permalink = String(ev.permalink || '').trim();
            html += '<div style="border:1px solid var(--line); border-radius:8px; padding:8px; background:var(--surface-2, rgba(255,255,255,0.02));">';
            html += '<div style="font-size:11px; color:var(--sub-text); margin-bottom:4px;">[' + source + '] ' + timestamp + (label ? (' / ' + label) : '') + '</div>';
            html += '<div style="font-size:12px; white-space:pre-wrap;">' + text + '</div>';
            if (permalink) {
              html += '<div style="margin-top:6px;"><a href="' + escapeHtml(permalink) + '" target="_blank" rel="noopener noreferrer" style="font-size:11px;">元データを開く</a></div>';
            }
            html += '</div>';
          });
          html += '</div>';
        }
        html += '</div>';
        html += '</details>';
        html += '</div>';
      }
      html += '</details>';
    }
    root.innerHTML = html || '<div class="group">結果がありません。</div>';
  }

  function renderSummaryPlainReport_(text) {
    var lines = String(text || '').split('\n');
    var html = '';
    var i;
    for (i = 0; i < lines.length; i++) {
      var line = lines[i] || '';
      var trimmed = line.replace(/^\s+|\s+$/g, '');
      if (!trimmed) {
        html += '<div class="summary-line summary-blank">&nbsp;</div>';
        continue;
      }
      if (/^●\s+/.test(trimmed)) {
        html += '<div class="summary-line summary-l1">' + escapeHtml(trimmed) + '</div>';
        continue;
      }
      if (/^　・\s*/.test(line) || /^・\s*/.test(trimmed)) {
        html += '<div class="summary-line summary-l2">' + escapeHtml(trimmed.replace(/^・\s*/, '・ ')) + '</div>';
        continue;
      }
      if (/^　　-\s*/.test(line) || /^-\s*/.test(trimmed)) {
        html += '<div class="summary-line summary-l3">' + escapeHtml(trimmed.replace(/^-\s*/, '- ')) + '</div>';
        continue;
      }
      html += '<div class="summary-line summary-text">' + escapeHtml(trimmed) + '</div>';
    }
    return html;
  }

  window.saveSummarySettingsUi = function() {
    var defs = serializeSummaryClientDefs_();
    var slackOwner = {};
    var backlogOwner = {};
    var duplicateHints = [];
    var i;
    var j;
    for (i = 0; i < defs.length; i++) {
      var name = defs[i].name || '（名称未入力）';
      var s = defs[i].slackChannels || [];
      var b = defs[i].backlogKeys || [];
      for (j = 0; j < s.length; j++) {
        var sid = s[j];
        if (slackOwner[sid] && slackOwner[sid] !== name) duplicateHints.push('Slack ' + sid + ' が「' + slackOwner[sid] + '」と重複');
        else slackOwner[sid] = name;
      }
      for (j = 0; j < b.length; j++) {
        var bid = b[j];
        if (backlogOwner[bid] && backlogOwner[bid] !== name) duplicateHints.push('Backlog ' + bid + ' が「' + backlogOwner[bid] + '」と重複');
        else backlogOwner[bid] = name;
      }
    }
    if (duplicateHints.length) {
      Swal.fire({
        icon: 'warning',
        title: '重複設定の注意',
        html: '<div style="text-align:left; font-size:12px;">' + duplicateHints.slice(0, 8).map(function(v){ return '・' + escapeHtml(v); }).join('<br>') +
          '<br><br>このまま保存すると、同じ活動が複数クライアントに反映される可能性があります。</div>',
        confirmButtonText: '保存を続ける',
        showCancelButton: true,
        cancelButtonText: '戻る'
      }).then(function(r) {
        if (r.isConfirmed) doSaveSummarySettings_(defs);
      });
      return;
    }
    doSaveSummarySettings_(defs);
  };

  function buildTagInput(label, className, values, placeholder, rowId) {
    const safeValues = Array.isArray(values) ? values : [];
    return `
      <div style="margin-bottom:8px;">
        <label style="font-size:0.8rem; color:var(--sub-text);">${label}</label>
        <div class="tag-input-container ${className}" data-row="${rowId}">
          ${safeValues.map(v => `<span class="tag-pill">${escapeHtml(v)}<button type="button" onclick="removeTagPill(this, '${rowId}')">×</button></span>`).join('')}
          <input type="text" class="tag-input-field" placeholder="${placeholder}"
                 onkeydown="handleTagInputKey(event, this)" onblur="commitTagInput(this)">
        </div>
      </div>`;
  }

  function handleTagInputKey(e, input) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      commitTagInput(input);
    }
  }

  function commitTagInput(input) {
    if (!input) return;
    const val = input.value.replace(/,/g, '').trim();
    if (!val) return;
    const tagContainer = input.parentElement;
    const rowId = (tagContainer && tagContainer.dataset && tagContainer.dataset.row)
      || ((input.closest('.alias-rule-row') && input.closest('.alias-rule-row').id) || '')
      || '';
    const existing = getTagValues(tagContainer);
    if (existing.indexOf(val) !== -1) {
      input.value = '';
      updateAliasSummary(rowId);
      return;
    }
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.innerHTML = `${escapeHtml(val)}<button type=\"button\" onclick=\"removeTagPill(this, '${rowId}')\">×</button>`;
    tagContainer.insertBefore(pill, input);
    input.value = '';
    serializeAliasRules();
    updateAliasSummary(rowId);
  }

  function removeTagPill(btn, rowId) {
    if (!btn || !btn.parentElement) return;
    btn.parentElement.remove();
    serializeAliasRules();
    const closestAliasRow = btn.closest('.alias-rule-row');
    updateAliasSummary(rowId || (closestAliasRow ? closestAliasRow.id : '') || '');
  }

  function getTagValues(container) {
    if (!container) return [];
    return Array.from(container.querySelectorAll('.tag-pill'))
      .map(p => p.textContent.replace('×', '').trim())
      .filter(Boolean);
  }

  function updateAliasSummary(rowId) {
    const row = document.getElementById(rowId);
    if (!row) return;

    const canonicalInput = row.querySelector('.alias-canonical');
    const summaryText = row.querySelector('.alias-summary-text');
    const badges = row.querySelector('.alias-tag-badges');
    const canonical = canonicalInput && canonicalInput.value ? canonicalInput.value.trim() : '';
    const displayName = canonical || '（名称未入力）';
    if (summaryText) {
      summaryText.textContent = displayName;
      summaryText.classList.toggle('alias-summary-empty', !canonical);
    }

    if (!badges) return;
    const badgeItems = [
      { label: 'Slack', count: getTagValues(row.querySelector('.alias-slack-tags')).length },
      { label: 'BL', count: getTagValues(row.querySelector('.alias-backlog-tags')).length },
      { label: 'KW', count: getTagValues(row.querySelector('.alias-keyword-tags')).length }
    ].filter(item => item.count > 0);
    badges.innerHTML = badgeItems.map(item =>
      `<span class="alias-tag-badge">${item.label}:${item.count}</span>`
    ).join('');
  }

  function serializeAliasRules(skipDirty) {
    const rows = [];
    const rowEls = document.querySelectorAll('#client-alias-container .backlog-row');
    rowEls.forEach(row => {
      updateAliasSummary(row.id);
      const canonicalEl = row.querySelector('.alias-canonical');
      const canonical = canonicalEl && canonicalEl.value ? canonicalEl.value.trim() : '';
      if (!canonical) return;
      rows.push({
        canonical,
        enabled: (function() { const el = row.querySelector('.alias-enabled-toggle'); return el ? el.checked !== false : true; })(),
        slackChannels: getTagValues(row.querySelector('.alias-slack-tags')),
        backlogKeys: getTagValues(row.querySelector('.alias-backlog-tags')).map(k => k.toUpperCase()),
        keywords: getTagValues(row.querySelector('.alias-keyword-tags'))
      });
    });
    const hidden = document.getElementById('clientAliasRules');
    const json = JSON.stringify(rows);
    if (hidden) hidden.value = json;
    if (!skipDirty && !isAliasFormLoading) {
      markAsDirty('settingForm');
    }
    return json;
  }

  window.loadAliasRulesIntoForm = function(jsonStr) {
    const container = document.getElementById('client-alias-container');
    if (!container) return;
    container.innerHTML = '';
    let rules = [];
    try {
      const parsed = JSON.parse(jsonStr || '[]');
      if (Array.isArray(parsed)) {
        rules = parsed;
      }
    } catch (e) {
      console.warn('Failed to parse client alias rules:', e);
    }

    isAliasFormLoading = true;
    if (rules.length > 0) {
      rules.forEach(rule => addClientAliasRow(rule, { expanded: false }));
    }
    isAliasFormLoading = false;
    serializeAliasRules(true);
  };

        Swal.fire({
          title: '💡 クライアント候補を自動提案',
          html: `
            <div style="text-align:left;">
              ${!hasAny ? `<div style="font-size:0.86rem; color:var(--sub-text); margin-bottom:12px;">すべてのチャンネル・プロジェクトはすでに登録済みです</div>` : ''}
              ${renderSection('Slack候補', 'slack', suggestions.slack || [])}
              ${renderSection('Backlog候補', 'backlog', suggestions.backlog || [])}
            </div>
          `,
          width: '680px',
          showCancelButton: true,
          confirmButtonText: '選択した候補をルールに追加',
          cancelButtonText: 'キャンセル',
          focusConfirm: false,
          didOpen: () => {
            document.querySelectorAll('.alias-suggest-toggle').forEach(function(button) {
              button.addEventListener('click', function() {
                const section = button.getAttribute('data-section');
                const boxes = Array.from(document.querySelectorAll(`.alias-suggest-check[data-section="${section}"]`));
                if (boxes.length === 0) return;
                const shouldCheckAll = boxes.some(function(box) { return !box.checked; });
                boxes.forEach(function(box) { box.checked = shouldCheckAll; });
              });
            });
          },
          preConfirm: () => {
            const checked = Array.from(document.querySelectorAll('.alias-suggest-check:checked')).map(function(box) {
              return {
                source: box.getAttribute('data-section'),
                id: box.getAttribute('data-id') || '',
                name: box.getAttribute('data-name') || '',
                projectKey: box.getAttribute('data-project-key') || ''
              };
            });
            if (checked.length === 0) {
              Swal.showValidationMessage('追加する候補を1件以上選択してください');
              return false;
            }
            return checked;
          }
        }).then(function(resultModal) {
          if (!resultModal.isConfirmed || !resultModal.value) return;

          const currentRules = JSON.parse(serializeAliasRules(true) || '[]');
          const existingSlack = {};
          const existingBacklog = {};
          currentRules.forEach(function(rule) {
            (rule.slackChannels || []).forEach(function(id) {
              if (id) existingSlack[id] = true;
            });
            (rule.backlogKeys || []).forEach(function(key) {
              if (key) existingBacklog[String(key).toUpperCase()] = true;
            });
          });

          let added = 0;
          resultModal.value.forEach(function(item) {
            if (item.source === 'slack') {
              if (existingSlack[item.id]) return;
              addClientAliasRow({
                canonical: `#${item.name}`,
                enabled: true,
                slackChannels: [item.id],
                backlogKeys: [],
                keywords: []
              }, { expanded: true });
              existingSlack[item.id] = true;
              added++;
              return;
            }
            const projectKey = (item.projectKey || '').toUpperCase();
            if (!projectKey || existingBacklog[projectKey]) return;
            addClientAliasRow({
              canonical: item.name,
              enabled: true,
              slackChannels: [],
              backlogKeys: [projectKey],
              keywords: []
            }, { expanded: true });
            existingBacklog[projectKey] = true;
            added++;
          });

          if (added === 0) {
            Swal.fire('情報', '選択した候補はすでに画面上のルールに追加されています。', 'info');
            return;
          }
          serializeAliasRules();
          Swal.fire('追加完了', `${added}件の候補をルールに追加しました。`, 'success');
        });
      })
      .withFailureHandler(function(e) {
        Swal.close();
        Swal.fire('エラー', e && e.message ? e.message : '候補の取得に失敗しました。', 'error');
      })
      .suggestClientAliasRules();
  };

  window.cleanHostUrl = function(input) {
    var val = input.value.trim();
    if (!val) return;
    if (val.indexOf('https://') === 0) {
      val = val.substring('https://'.length);
    } else if (val.indexOf('http://') === 0) {
      val = val.substring('http://'.length);
    }
    if (val.length > 1 && val.charAt(val.length - 1) === '/') {
      val = val.substring(0, val.length - 1);
    }
    input.value = val;
  }

  /**
   * 保存用にすべての設定を収集し、バリデーションを行います。
   * @returns {object|null} 設定データオブジェクト、またはバリデーションエラーの場合はnull
   */
  function collectAllSettingsForSave(baseData) {
    const data = baseData || collectAllSettings();
    if (!data) return null;

    if (data.scheduleEnable === 'on' && data.scheduleDays.length === 0) {
      Swal.fire({
        icon: 'warning',
        title: '設定エラー',
        text: '自動実行を設定する場合、曜日を少なくとも1つ選択してください📅',
        confirmButtonColor: '#1a73e8'
      });
      return null;
    }

    // サーバーサイドのsaveUserSettingsが期待するプロパティ名に変換
    const serverData = {
      ...data,
      CALENDAR_IGNORE_WORDS: data.ignoreWords,
      SLACK_IGNORE_CHANNELS: data.ignoreChannels,
      reportDate: data.manualDate,
      // 不要なプロパティを削除
      ignoreWords: undefined,
      ignoreChannels: undefined,
      manualDate: undefined,
      promptSummary: undefined,
      promptDetail: undefined,
      promptManhour: undefined,
      promptReflection: undefined,
      promptAggregation: undefined
    };
    return serverData;
  }

/**
 * AIが生成したMarkdownテーブルの構造を修正します。
 * @param {string} text AIが生成したテキスト
 * @returns {string} 修正後のテキスト
 */
function fixTableStructure(text) {
  // 1. 見出しとテーブルの間に空行を強制挿入
  text = text.replace(/(▼[^\n]+)\n(\s*)(\|[^\n]+\|)/g, '$1\n\n$3');
  
  // 2. 4列テーブルを3列に修正（最初の列を削除）
  const lines = text.split('\n');
  const fixedLines = lines.map(line => {
    // テーブル行を検出（4つ以上のパイプを含む）
    if (line.trim().match(/^\|[^|]+\|[^|]+\|[^|]+\|[^|]+\|/)) {
      // 最初のデータ列を削除
      return line.replace(/^(\s*\|)[^|]+(\s*\|)/, '$1');
    }
    return line;
  });
  return fixedLines.join('\n');
}

function extractChartDataFromSummaryTable(text) {
  if (!text) return null;
  const src = String(text);
  const lines = src.split('\n');
  const map = {};
  let foundHeader = false;

  // できる限り「プロジェクト別サマリ」セクションを優先して読む
  const summaryHeadingIdx = lines.findIndex(function(line) {
    return /プロジェクト別サマリ/.test(line);
  });
  const targetLines = summaryHeadingIdx >= 0 ? lines.slice(summaryHeadingIdx) : lines;

  for (let i = 0; i < targetLines.length; i++) {
    const line = (targetLines[i] || '').trim();
    if (!line) continue;
    // 日別ブロックに入ったら打ち切る
    if (/^▼\s*\d{4}\/\d{2}\/\d{2}/.test(line) || /日別・工数入力データ/.test(line)) break;
    if (!line.startsWith('|')) continue;
    if (line.indexOf('プロジェクト') !== -1 || line.indexOf('種別') !== -1) {
      foundHeader = true;
      continue;
    }
    if (/^\|\s*:?-{2,}:?\s*\|/.test(line) || /^\|\s*-{2,}/.test(line)) continue;
    const cells = line.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
    if (cells.length < 2) continue;
    const label = (cells[0] || '').replace(/\*\*/g, '').trim();
    if (!label) continue;
    const hourMatch = String(cells[1] || '').match(/-?\d+(?:\.\d+)?/);
    if (!hourMatch) continue;
    const hours = Number(hourMatch[0]);
    if (!Number.isFinite(hours) || hours <= 0) continue;
    map[label] = (map[label] || 0) + hours;
  }

  const data = Object.keys(map).map(function(label) {
    return { label: label, hours: map[label] };
  });
  if (!data.length && !foundHeader) return null;
  if (!data.length) return null;
  data.sort(function(a, b) { return b.hours - a.hours; });
  return data;
}

function buildSummaryFromDailyText(dailyText) {
  if (!dailyText) return null;
  const lines = String(dailyText).split('\n');
  const map = {};
  for (let i = 0; i < lines.length; i++) {
    const line = (lines[i] || '').trim();
    if (!line.startsWith('|')) continue;
    if (line.indexOf('種別') !== -1 || /^\|\s*:?-{2,}:?\s*\|/.test(line) || /^\|\s*-{2,}/.test(line)) continue;
    const cells = line.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
    if (cells.length < 2) continue;
    const label = (cells[0] || '').replace(/\*\*/g, '').trim();
    if (!label) continue;
    const hourMatch = String(cells[1] || '').match(/-?\d+(?:\.\d+)?/);
    if (!hourMatch) continue;
    const hours = Number(hourMatch[0]);
    if (!Number.isFinite(hours) || hours <= 0) continue;
    map[label] = (map[label] || 0) + hours;
  }
  const rows = Object.keys(map).map(function(label) { return { label: label, hours: map[label] }; });
  if (!rows.length) return null;
  rows.sort(function(a, b) { return b.hours - a.hours; });
  const total = rows.reduce(function(acc, r){ return acc + r.hours; }, 0);
  const md = [
    '📊 **プロジェクト別サマリ（再構築）**',
    '',
    '| プロジェクト | 合計時間 |',
    '|---|---:|'
  ];
  rows.forEach(function(r) {
    md.push('| ' + r.label + ' | ' + r.hours.toFixed(1) + 'h |');
  });
  md.push('');
  md.push('💰 合計: ' + total.toFixed(1) + '時間');
  return { markdown: md.join('\n'), chartData: rows };
}
  function renderAggResult(fullText) {
    console.log("Raw Response:", fullText);

    // 1. JSON抽出 (かなり緩く探す)
    var jsonMatch = fullText.match(/```(?:json)?\s*(\[\s*\{[\s\S]*?\}\s*\])\s*```/);
    if (!jsonMatch) {
          // コードブロックがない場合、直書きのJSON配列を探す
          jsonMatch = fullText.match(/(\[\s*\{[\s\S]*?\}\s*\])/);
    }

    var chartData = null;
    var summaryText = fullText;

    if (jsonMatch && jsonMatch[1]) {
        try {
            chartData = JSON.parse(jsonMatch[1]);
            // 工数の多い順（降順）にソート
            chartData.sort(function(a, b) { return b.hours - a.hours; });
            // 本文からJSON部分を削除して見やすくする
            summaryText = fullText.replace(jsonMatch[0], '');
        } catch(e) {
            console.error("JSON Parse Error:", e);
        }
    }
    // 2. 日別データの分割（表記ゆれに強いロジック）
    var baseText = summaryText;
    var dailyText = "";
    var splitStart = -1;
    var splitPatterns = [
      /(?:^|\n)\s*📅\s*\*{0,2}\s*日別/m,
      /(?:^|\n)\s*(?:#+\s*)?日別・工数入力データ/m,
      /(?:^|\n)\s*(?:#+\s*)?日別データ/m,
      /(?:^|\n)\s*[-]{5,}\s*\n\s*📅/m,
      /(?:^|\n)\s*▼\s*\d{4}\/\d{2}\/\d{2}/m
    ];

    for (var i = 0; i < splitPatterns.length; i++) {
      var m = splitPatterns[i].exec(baseText);
      if (m && typeof m.index === 'number') {
        splitStart = m.index + (m[0].startsWith('\n') ? 1 : 0);
        break;
      }
    }

    if (splitStart >= 0) {
      summaryText = baseText.slice(0, splitStart).trim();
      dailyText = baseText.slice(splitStart).trim();
    } else {
      // 分割不可でもUIを壊さない:
      // サマリ/日別の両方に本文を表示して確認可能にする
      summaryText = baseText.trim();
      dailyText = baseText.trim();
    }

    // ★★★ 修正: フロントエンドでの検証とフォールバック (aggregation-table-fix.md) ★★★
    dailyText = fixTableStructure(dailyText); // 4列テーブルなどを修正

    // 空のテーブル行を削除
    dailyText = dailyText.replace(/^\s*\|(\s*\|)+\s*$/gm, '');

    // テーブルが全く生成されていない場合のエラーハンドリング
    if (!dailyText.includes('|---|')) {
      dailyText = "⚠️ テーブル形式での表示に失敗しました。\n\n---\n" + dailyText;
    }
    // ★★★ 修正ここまで ★★★    
    if (!chartData) {
      chartData = extractChartDataFromSummaryTable(summaryText);
    }
    if (!summaryText || !summaryText.trim()) {
      const rebuilt = buildSummaryFromDailyText(dailyText);
      if (rebuilt) {
        summaryText = rebuilt.markdown;
        if (!chartData) chartData = rebuilt.chartData;
      } else {
        summaryText = "（サマリを抽出・再構築できませんでした。日別タブを参照してください）";
      }
    }
    
    // 3. 表示実行
    document.getElementById('aggSummaryText').innerHTML = marked.parse(summaryText);
    document.getElementById('aggDailyText').innerHTML = marked.parse(dailyText);
    window.lastAggText = dailyText;
    window.lastAggJson = chartData; // 修正指示機能とチャートクリック機能用

    // ★修正: 結果エリアを表示し、強制的に「日別データ」タブをアクティブにする
    var resArea = document.getElementById('agg-result-area');
    resArea.style.display = 'block';
    
    // ★ここを変更: 強制的に「日別」タブをクリックさせる
    document.getElementById('btn-tab-daily').click();

    // グラフ描画
    if (chartData) {
        setTimeout(function(){ renderAggChart(chartData, 'label'); }, 200);
    } else {
        document.getElementById('aggChart').style.display = 'none';
    }
    
    // スクロール
    setTimeout(function(){ resArea.scrollIntoView({behavior:'smooth', block:'start'}); }, 300);
  }

  function highlightProjectInData(projectName) {

      dailyContainer.querySelectorAll('li').forEach(li => {
          if (li.textContent.includes(`[${projectName}]`) || li.textContent.includes(projectName)) {
              li.style.backgroundColor = 'var(--highlight)';
          }
      });
      // テーブル形式の場合、該当行をハイライト
      dailyContainer.querySelectorAll('tr').forEach(tr => {

          }
      });

  // --- ★提案3: 設定のインポート/エクスポート ---
  function collectAllSettings() {
    const form = document.getElementById('connectionForm');
    const settingsForm = document.getElementById('settingForm');
    const promptForm = document.getElementById('promptForm');

    const formData = new FormData(form);
    const settingsFormData = new FormData(settingsForm);
    for (const [key, value] of settingsFormData.entries()) { formData.append(key, value); }
    const promptFormData = new FormData(promptForm);
    for (const [key, value] of promptFormData.entries()) { formData.append(key, value); }

    const data = Object.fromEntries(formData.entries());

    // Checkboxes and other manual data
    const scheduleEnableEl = document.querySelector('input[name="scheduleEnable"]:checked');
    data.scheduleEnable = scheduleEnableEl ? scheduleEnableEl.value : 'off';
    data.scheduleDays = Array.from(document.querySelectorAll('.day-checkbox:checked')).map(cb => cb.value);
    data.skipHolidays = document.getElementById('skipHolidays').checked;

    const todoNotifyEnableEl = document.querySelector('input[name="todoNotifyEnable"]:checked');
    const todoNotifyTimeEl = document.getElementById('todoNotifyTime');
    data.todoNotifyEnable = todoNotifyEnableEl ? todoNotifyEnableEl.value : 'off';
    data.todoNotifyTime = todoNotifyTimeEl ? todoNotifyTimeEl.value : '09:00';
    data.todoNotifyDays = Array.from(document.querySelectorAll('.todo-day-checkbox:checked')).map(cb => cb.value);
    const todoSkipHolidaysEl = document.getElementById('todoSkipHolidays');
    const todoSlackStyleEl = document.getElementById('todoSlackStyle');
    const todoFixedThreadUrlEl = document.getElementById('todoFixedThreadUrl');
    data.todoSkipHolidays = todoSkipHolidaysEl ? !!todoSkipHolidaysEl.checked : false;
    data.todoSlackStyle = todoSlackStyleEl ? todoSlackStyleEl.value : 'direct';
    data.todoFixedThreadUrl = todoFixedThreadUrlEl && todoFixedThreadUrlEl.value ? todoFixedThreadUrlEl.value.trim() : '';
    // prompt textarea は name 属性がないため、明示的に収集する
    const promptSummaryEl = document.getElementById('promptSummary');
    const promptManhourEl = document.getElementById('promptManhour');
    const promptReflectionEl = document.getElementById('promptReflection');
    const promptAggregationEl = document.getElementById('promptAggregation');
    data.promptSummary = promptSummaryEl ? promptSummaryEl.value : '';
    data.promptManhour = promptManhourEl ? promptManhourEl.value : '';
    data.promptReflection = promptReflectionEl ? promptReflectionEl.value : '';
    data.promptAggregation = promptAggregationEl ? promptAggregationEl.value : '';

    const blConfigs = [];
    document.querySelectorAll('#backlog-container .backlog-row').forEach(row => {
      blConfigs.push({
        label: row.querySelector('.bl-label').value,
        host: row.querySelector('.bl-host').value,
        key: row.querySelector('.bl-key').value
      });
    });
    data.backlogConfigs = blConfigs;

    // 部署選択（run タブ内のため FormData に含まれない）
    data.selectedDepartment = 'CS';

    // クライアント名寄せ辞書（フォーム外にあるため手動取得）
    serializeAliasRules(true);
    const aliasHidden = document.getElementById('clientAliasRules');
    const aliasError = document.getElementById('alias-error');
    data.clientAliasRules = aliasHidden ? aliasHidden.value : '[]';
    if (data.clientAliasRules) {
      try {
        JSON.parse(data.clientAliasRules);
        if (aliasError) {
          aliasError.style.display = 'none';
          aliasError.textContent = '';
        }
      } catch (e) {
        if (aliasError) {
          aliasError.textContent = '⚠️ 名寄せルールのデータが壊れています。再設定してください。';
          aliasError.style.display = 'block';
        }
        return null;
      }
    }

    const clientFallbackNameEl = document.getElementById('clientFallbackName');
    const reportSlackHousekeepingEl = document.getElementById('reportSlackHousekeeping');
    data.clientFallbackName = clientFallbackNameEl && clientFallbackNameEl.value ? clientFallbackNameEl.value.trim() : '● その他';
    data.reportSlackHousekeeping = reportSlackHousekeepingEl && reportSlackHousekeepingEl.checked ? 'on' : 'off';
    const avgWorkHoursEl = document.getElementById('avgWorkHours');
    const projectListEl = document.getElementById('projectList');
    const projectAliasRulesEl = document.getElementById('projectAliasRules');
    data.avgWorkHours = avgWorkHoursEl ? avgWorkHoursEl.value : '';
    data.projectList = projectListEl ? projectListEl.value : '';
    data.projectAliasRules = projectAliasRulesEl ? projectAliasRulesEl.value : '[]';
    const summaryRulesEl = document.getElementById('summaryClientRules');
    const summarySelectedEl = document.getElementById('summarySelectedClientIds');
    const summaryEvidenceEl = document.getElementById('summaryShowEvidence');
    const summaryCollectionModeEl = document.getElementById('summaryCollectionMode');
    data.summaryClientRules = summaryRulesEl ? summaryRulesEl.value : '[]';
    data.summarySelectedClientIds = summarySelectedEl ? summarySelectedEl.value : '[]';
    data.summaryEvidenceDefault = summaryEvidenceEl && summaryEvidenceEl.checked ? 'on' : 'off';
    data.summaryCollectionMode = summaryCollectionModeEl ? summaryCollectionModeEl.value : 'light';
    const promptClientSummaryEl = document.getElementById('promptClientSummary');
    data.promptClientSummary = promptClientSummaryEl ? promptClientSummaryEl.value : '';

    return data;
  }

  function parseJsonSettingArray_(value, fallback) {
    if (Array.isArray(value)) return value;
    if (!value) return fallback || [];
    try {
      const parsed = JSON.parse(value);
      return Array.isArray(parsed) ? parsed : (fallback || []);
    } catch (e) {
      return fallback || [];
    }
  }

  function sanitizeBacklogConfigsForExport_(configs) {
    return (Array.isArray(configs) ? configs : []).map(function(c) {
      return { label: c.label || '', host: c.host || '' };
    });
  }

  function buildSettingsExportPayload_(data) {
    const source = data || {};
    const summaryRules = parseJsonSettingArray_(source.summaryClientRules || source.SUMMARY_CLIENT_RULES, []);
    const summarySelected = parseJsonSettingArray_(source.summarySelectedClientIds || source.SUMMARY_SELECTED_CLIENT_IDS, []);
    return {
      schemaVersion: 2,
      exportedAt: new Date().toISOString(),
      app: 'geminippo-gas',
      settings: {
        connection: {
          slackId: source.slackId || '',
          reportFlashModelId: source.reportFlashModelId || '',
          slackScope: source.slackScope || 'private',
          ignoreWords: source.ignoreWords || '',
          ignoreChannels: source.ignoreChannels || '',
          backlogConfigs: sanitizeBacklogConfigsForExport_(source.backlogConfigs || [])
        },
        dailyReport: {
          slackStyle: source.slackStyle || 'direct',
          slackFormat: source.slackFormat || 'markdown_block',
          fixedThreadUrl: source.fixedThreadUrl || '',
          bulletStyle: source.bulletStyle || 'markdown',
          reportManhour: source.reportManhour || 'あり',
          reportReflection: source.reportReflection || 'あり',
          scheduleEnable: source.scheduleEnable || 'off',
          scheduleTime: source.scheduleTime || '',
          scheduleDays: source.scheduleDays || [],
          skipHolidays: !!source.skipHolidays,
          reportSlackHousekeeping: source.reportSlackHousekeeping || 'off'
        },
        aggregation: {
          avgWorkHours: source.avgWorkHours || '',
          projectList: source.projectList || '',
          projectAliasRules: parseJsonSettingArray_(source.projectAliasRules, [])
        },
        todo: {
          todoNotifyEnable: source.todoNotifyEnable || 'off',
          todoNotifyTime: source.todoNotifyTime || '09:00',
          todoNotifyDays: source.todoNotifyDays || [],
          todoSkipHolidays: !!source.todoSkipHolidays,
          todoSlackStyle: source.todoSlackStyle || 'direct',
          todoFixedThreadUrl: source.todoFixedThreadUrl || ''
        },
        summary: {
          summaryClientRules: summaryRules,
          summarySelectedClientIds: summarySelected,
          summaryEvidenceDefault: source.summaryEvidenceDefault || 'on',
          summaryCollectionMode: source.summaryCollectionMode || source.SUMMARY_COLLECTION_MODE || 'light'
        },
        clientAlias: {
          clientFallbackName: source.clientFallbackName || '● その他',
          clientAliasRules: parseJsonSettingArray_(source.clientAliasRules || source.CLIENT_ALIAS_RULES, [])
        },
        prompts: {
          promptSummary: source.promptSummary || '',
          promptManhour: source.promptManhour || '',
          promptReflection: source.promptReflection || '',
          promptAggregation: source.promptAggregation || '',
          promptClientSummary: source.promptClientSummary || ''
        }
      },
      redactions: ['BACKLOG_CONFIGS.key', 'SLACK_USER_TOKEN', 'SF_ACCESS_TOKEN', 'SF_REFRESH_TOKEN']
    };
  }

  function flattenImportedSettings_(payload) {
    if (!payload || typeof payload !== 'object') throw new Error('設定ファイルが空です。');
    if (!payload.schemaVersion) return payload;
    if (payload.app && payload.app !== 'geminippo-gas') {
      throw new Error('このアプリ用の設定ファイルではありません。');
    }
    const settings = payload.settings || {};
    const flat = {};
    [
      settings.connection,
      settings.dailyReport,
      settings.aggregation,
      settings.todo,
      settings.summary,
      settings.clientAlias,
      settings.prompts
    ].forEach(function(group) {
      Object.assign(flat, group || {});
    });
    if (Array.isArray(flat.clientAliasRules)) flat.clientAliasRules = JSON.stringify(flat.clientAliasRules);
    if (Array.isArray(flat.summaryClientRules)) flat.summaryClientRules = JSON.stringify(flat.summaryClientRules);
    if (Array.isArray(flat.summarySelectedClientIds)) flat.summarySelectedClientIds = JSON.stringify(flat.summarySelectedClientIds);
    if (Array.isArray(flat.projectAliasRules)) flat.projectAliasRules = JSON.stringify(flat.projectAliasRules);
    return flat;
  }

  function exportSettings() {
      const data = collectAllSettings();
      if (!data) return;
      const payload = buildSettingsExportPayload_(data);
      const jsonString = JSON.stringify(payload, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'geminippo-settings-v2.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
  }

  window.importSettings = function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = readerEvent => {
              try {
                  const content = readerEvent.target.result;
                  const settings = flattenImportedSettings_(JSON.parse(content));
                  applySettingsToForm(settings);
                  Swal.fire('インポート完了', '設定をフォームに反映しました。\n内容を確認し、接続設定・日報設定・TODO設定・サマリ設定・プロンプト設定を保存してください。', 'success');
              } catch (err) {
                  Swal.fire('インポート失敗', err && err.message ? err.message : 'ファイルの形式が正しくないか、読み込みに失敗しました。', 'error');
              }
          };
          reader.readAsText(file, 'UTF-8');
      };
      input.click();
  }

  function applySettingsToForm(settings) {
    // この関数は、settingsオブジェクトのキーと値を使って、各フォーム要素に値を設定するロジックを実装します。
    // 例: document.getElementById('slackId').value = settings.slackId;
    // ★★★ 修正: 汎用的なフォーム適用ロジックに改善 ★★★
    Object.keys(settings).forEach(key => {
      const value = settings[key];
      const el = document.getElementById(key) || document.querySelector(`[name="${key}"]`);

      if (!el) return;

      if (el.type === 'checkbox') {
        if (typeof value === 'string') {
          el.checked = (value === 'on' || value === 'true' || value === '1');
        } else {
          el.checked = !!value;
        }
      } else if (el.type === 'radio') {
        // name属性でラジオボタングループを探して、該当するvalueを持つものをチェック
        document.querySelectorAll(`input[name="${key}"]`).forEach(rb => {
          rb.checked = (rb.value === String(value));
        });
      } else {
        el.value = value;
      }
    });

    // スケジュール有効/無効
    if (settings.scheduleEnable) {
      const radio = document.querySelector(`input[name="scheduleEnable"][value="${settings.scheduleEnable}"]`);
      if(radio) {
        radio.checked = true;
        toggleTime(settings.scheduleEnable === 'on');
      }
    }
    // 曜日
    document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = false);
    if (settings.scheduleDays && Array.isArray(settings.scheduleDays)) {
      settings.scheduleDays.forEach(day => {
        const cb = document.getElementById(`day_${day}`);
        if (cb) cb.checked = true;
      });
    }

    if (settings.backlogConfigs && Array.isArray(settings.backlogConfigs)) {
        document.getElementById('backlog-container').innerHTML = '';
        settings.backlogConfigs.forEach(c => addBacklogRow(c));
    }

    const aliasJson = settings.clientAliasRules || settings.CLIENT_ALIAS_RULES;
    if (aliasJson) {
      loadAliasRulesIntoForm(aliasJson);
    }
    const fallbackName = settings.clientFallbackName || settings.CLIENT_FALLBACK_NAME;
    if (fallbackName) {
      const fallbackInput = document.getElementById('clientFallbackName');
      if (fallbackInput) fallbackInput.value = fallbackName;
    }

    const todoEnable = settings.todoNotifyEnable || settings.TODO_NOTIFY_ENABLE;
    if (todoEnable) {
      const radio = document.querySelector(`input[name="todoNotifyEnable"][value="${todoEnable}"]`);
      if (radio) {
        radio.checked = true;
        toggleTodoTime(todoEnable === 'on');
      }
    }
    const todoTime = settings.todoNotifyTime || settings.TODO_NOTIFY_TIME;
    if (document.getElementById('todoNotifyTime')) {
      document.getElementById('todoNotifyTime').value = (todoTime && todoTime !== 'off') ? todoTime : '09:00';
    }
    const todoSlackStyle = settings.todoSlackStyle || settings.TODO_SLACK_STYLE || 'direct';
    const todoSlackStyleEl = document.getElementById('todoSlackStyle');
    if (todoSlackStyleEl) {
      todoSlackStyleEl.value = todoSlackStyle;
      toggleTodoFixedThread(todoSlackStyle);
    }
    const slackFormat = settings.slackFormat || settings.REPORT_SLACK_FORMAT || 'markdown_block';
    const slackFormatEl = document.getElementById('slackFormat');
    if (slackFormatEl) {
      slackFormatEl.value = slackFormat === 'text' ? 'text' : 'markdown_block';
    }
    const todoFixedThreadUrl = settings.todoFixedThreadUrl || settings.TODO_FIXED_THREAD_URL || '';
    const todoFixedThreadUrlEl = document.getElementById('todoFixedThreadUrl');
    if (todoFixedThreadUrlEl) {
      todoFixedThreadUrlEl.value = todoFixedThreadUrl;
    }
    const todoSkipHolidaysValue = settings.todoSkipHolidays || settings.TODO_SKIP_HOLIDAYS;
    const todoSkipHolidaysEl = document.getElementById('todoSkipHolidays');
    if (todoSkipHolidaysEl) {
      todoSkipHolidaysEl.checked = (todoSkipHolidaysValue === true || todoSkipHolidaysValue === 'true' || todoSkipHolidaysValue === 'on');
    }
    const primaryModel = settings.reportFlashModelId || settings.REPORT_FLASH_MODEL_ID;
    const primaryModelEl = document.getElementById('reportFlashModelId');
    if (primaryModelEl && primaryModel) {
      primaryModelEl.value = primaryModel;
    }
    const avgWorkHours = settings.avgWorkHours || settings.AVG_WORK_HOURS;
    const avgWorkHoursEl = document.getElementById('avgWorkHours');
    if (avgWorkHoursEl && avgWorkHours) {

  function prettifyTodoLinks(text) {
    if (!text) return '';
    return text.replace(/<!--REM:(https?:\/\/[^|>]+)\|([^>]+)-->/g, function(_, url, labelEnc) {
      const label = decodeURIComponent(labelEnc || '');
      const state = todoReminderStateMap[url] || 'none';
      const isMuted = (state === 'muted');
      const btnClass = isMuted
        ? (document.body.classList.contains('dark-mode')
            ? 'border-color:#34a853; color:#9ff3b0; background:#1f3b2a;'
            : 'border-color:#1e8e3e; color:#1e8e3e; background:#e6f4ea;')
        : '';
      const nextState = isMuted ? 'none' : 'muted';
      const icon = isMuted ? '🔕' : '🔔';
      const title = isMuted ? '通知を再開' : '通知しない';
      return `<span style="margin-left:8px; display:inline-flex; gap:6px;">
        <button type="button" class="btn-test" title="${title}" style="margin-top:0; font-size:12px; padding:3px 8px; ${btnClass}" onclick="setTodoReminderState('${escapeAttr(url)}','${escapeAttr(label)}','${nextState}', this)">${icon}</button>
      </span>`;
    });
  }

  function buildTodoReminderStateMap(ruleData) {
    const map = {};
    const muted = (ruleData && Array.isArray(ruleData.muted)) ? ruleData.muted : [];
    const checked = (ruleData && Array.isArray(ruleData.checked)) ? ruleData.checked : [];
    muted.forEach(function(item) { if (item && item.url) map[item.url] = 'muted'; });
    checked.forEach(function(item) { if (item && item.url) map[item.url] = 'checked'; });
    return map;
  }

  window.setTodoReminderState = function(url, label, state, btnEl) {
    if (!url) return;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          todoReminderStateMap[url] = state;
          const box = document.getElementById('todoResult');
          if (box && latestTodoMessage) {
            box.innerHTML = marked.parse(prettifyTodoLinks(latestTodoMessage));
          }
          loadTodoReminderRules();
        } else {
          Swal.fire('更新失敗', (res && res.message) || '状態更新に失敗しました。', 'error');
        }
      })
      .withFailureHandler(function(e) {
        Swal.fire('更新失敗', e && e.message ? e.message : '状態更新に失敗しました。', 'error');
      })
      .setTodoReminderState(url, label || '', state);
  };

  window.loadTodoReminderRules = function() {
    const el = document.getElementById('todoRuleList');
    if (!el) return;
    el.innerHTML = '読込中...';
    google.script.run
      .withSuccessHandler(function(ruleData) {
        const muted = (ruleData && Array.isArray(ruleData.muted)) ? ruleData.muted : [];
        const checked = (ruleData && Array.isArray(ruleData.checked)) ? ruleData.checked : [];
        const rows = [];
        muted.forEach(function(item) {
          rows.push(`<div style="margin-bottom:6px;"><strong>🔕 ミュート</strong> ${escapeHtml(item.label || item.url)} <button type="button" class="btn-test" style="margin-top:0; font-size:11px;" onclick="clearTodoReminderRule('${escapeAttr(item.url)}')">解除</button></div>`);
        });
        checked.forEach(function(item) {
          rows.push(`<div style="margin-bottom:6px;"><strong>✅ チェック済み</strong> ${escapeHtml(item.label || item.url)} <button type="button" class="btn-test" style="margin-top:0; font-size:11px;" onclick="clearTodoReminderRule('${escapeAttr(item.url)}')">解除</button></div>`);
        });
        el.innerHTML = rows.length ? rows.join('') : '登録済みルールはありません。';
      })
      .withFailureHandler(function() {
        el.innerHTML = 'ルールの読み込みに失敗しました。';
      })
      .listTodoReminderRules();
  };

  window.clearTodoReminderRule = function(url) {
    if (!url) return;
    google.script.run
      .withSuccessHandler(function() {
        delete todoReminderStateMap[url];
        if (latestTodoMessage) {
          const box = document.getElementById('todoResult');
          if (box) box.innerHTML = marked.parse(prettifyTodoLinks(latestTodoMessage));

  };

    const time = document.getElementById('todoNotifyTime').value || '09:00';
    const days = Array.from(document.querySelectorAll('.todo-day-checkbox:checked')).map(cb => cb.value);
    const todoSkipHolidaysEl2 = document.getElementById('todoSkipHolidays');
    const todoSlackStyleEl2 = document.getElementById('todoSlackStyle');
    const todoFixedThreadUrlEl2 = document.getElementById('todoFixedThreadUrl');
    const todoSkipHolidays = todoSkipHolidaysEl2 ? !!todoSkipHolidaysEl2.checked : false;
    const todoSlackStyle = todoSlackStyleEl2 ? todoSlackStyleEl2.value : 'direct';
    const todoFixedThreadUrl = todoFixedThreadUrlEl2 && todoFixedThreadUrlEl2.value ? todoFixedThreadUrlEl2.value.trim() : '';

    showLoading(true, '通知設定を保存しています...', false);
    google.script.run
      .withSuccessHandler(function(res) {
        showLoading(false);
        refreshSettingsFromServer_();
        Swal.fire({ icon: 'success', title: '保存しました', timer: 1500, showConfirmButton: false });
      })
      .withFailureHandler(function(e) {
        showLoading(false);
        Swal.fire('保存エラー', e.message, 'error');
      })
      .saveTodoSettings({
        todoNotifyEnable: enable,
        todoNotifyTime: time,
        todoNotifyDays: days,
        todoSkipHolidays: todoSkipHolidays,
        todoSlackStyle: todoSlackStyle,
        todoFixedThreadUrl: todoFixedThreadUrl
      });
  };

  function refreshSettingsFromServer_() {
    google.script.run
      .withSuccessHandler(function(serverSettings) {
        var hidden;
        var promptEl;
        var showEl;
        if (!serverSettings) return;
        applySettingsToForm(serverSettings);
        if (Object.prototype.hasOwnProperty.call(serverSettings, 'SUMMARY_CLIENT_RULES')) {
          hidden = document.getElementById('summaryClientRules');
          if (hidden) hidden.value = serverSettings.SUMMARY_CLIENT_RULES || '[]';
          hidden = document.getElementById('summarySelectedClientIds');
          if (hidden) hidden.value = serverSettings.SUMMARY_SELECTED_CLIENT_IDS || '[]';
          summaryClientDefs = parseSummaryRulesFromHidden_();
          summarySelectedClientIds = parseSummarySelectedClientIds_();
          renderSummaryClientList_();
          renderSummaryClientSelect_();
          preloadSummarySlackNames_();
          preloadSummaryBacklogNames_();
        }
        showEl = document.getElementById('summaryShowEvidence');
        if (showEl) showEl.checked = true;
      })
      .withFailureHandler(function() {})
      .getUserSettings();
  }

  // ------------------------------------
</script>
