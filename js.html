<script>
  let myChart = null;
  let promptDetailCache = '';
  let latestTodoMessage = '';
  let todoReminderStateMap = {};
  marked.use({
    renderer: {
      link({ href, title, tokens }) {
        const text = this.parser.parseInline(tokens);
        const safeTitle = title ? ` title="${escapeAttr(title)}"` : '';
        return `<a href="${escapeAttr(href || '')}" target="_blank" rel="noopener noreferrer"${safeTitle}>${text}</a>`;
      }
    }
  });

  // =============================================
  // UI Event Handlers
  // =============================================

  /**
   * メインのタブを切り替えます。
   * @param {string} id 表示するコンテンツのID
   * @param {Event} [evt] クリックイベント（GASサンドボックスで global event が使えない場合用）
   */
  function hasUnsavedChanges_() {
    const connectionDirty = Array.from(document.querySelectorAll('#connection .btn-primary, #settings .btn-primary, #reportSettingsMount .btn-primary'))
      .some(function(btn) { return (btn && btn.innerText || '').trim().endsWith('*'); });
    const promptBtn = document.querySelector('#prompts .btn-primary');
    const promptDirty = !!(promptBtn && (promptBtn.innerText || '').trim().endsWith('*'));
    return connectionDirty || promptDirty;
  }

  function clearAllDirtyState_() {
    clearDirtyState('connectionForm');
    clearDirtyState('settingForm');
    clearDirtyState('promptForm');
  }

  function performSwitchTab_(id, evt) {
    document.querySelectorAll('.tab-btn[data-tab]').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.content').forEach(content => content.classList.remove('active'));
    if (id !== 'admin') {
      document.querySelectorAll('.settings-content').forEach(content => content.classList.remove('active'));
      document.querySelectorAll('.settings-tab-btn[data-admin-tab]').forEach(btn => btn.classList.remove('active'));
    }
    const e = evt || (typeof event !== 'undefined' ? event : null);
    if (e && e.currentTarget) {
      e.currentTarget.classList.add('active');
    } else {
      var btn = document.querySelector('.tab-btn[data-tab="' + id + '"]');
      if (btn) btn.classList.add('active');
    }
    var el = document.getElementById(id);
    if (el) el.classList.add('active');
    if (id === 'admin') performSwitchAdminTab_('connection');
  }

  window.switchTab = function(id, evt) {
    const currentTab = document.querySelector('.tab-btn[data-tab].active')?.getAttribute('data-tab');
    if (currentTab === id) return;
    if (!hasUnsavedChanges_()) {
      performSwitchTab_(id, evt);
      return;
    }
    Swal.fire({
      icon: 'warning',
      title: '未保存の変更があります',
      text: '保存せずにタブを切り替えますか？',
      showCancelButton: true,
      confirmButtonText: '切り替える',
      cancelButtonText: 'このまま編集する'
    }).then(function(result) {
      if (result.isConfirmed) {
        clearAllDirtyState_();
        performSwitchTab_(id, evt);
      }
    });
  };

  function performSwitchAdminTab_(id, evt) {
    document.querySelectorAll('.settings-tab-btn[data-admin-tab]').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.settings-content').forEach(content => content.classList.remove('active'));
    const e = evt || (typeof event !== 'undefined' ? event : null);
    if (e && e.currentTarget) {
      e.currentTarget.classList.add('active');
    } else {
      var btn = document.querySelector('.settings-tab-btn[data-admin-tab="' + id + '"]');
      if (btn) btn.classList.add('active');
    }
    var el = document.getElementById(id);
    if (el) el.classList.add('active');
  }

  window.switchAdminTab = function(id, evt) {
    const currentTab = document.querySelector('.settings-tab-btn[data-admin-tab].active')?.getAttribute('data-admin-tab');
    if (currentTab === id) return;
    if (!hasUnsavedChanges_()) {
      performSwitchAdminTab_(id, evt);
      return;
    }
    Swal.fire({
      icon: 'warning',
      title: '未保存の変更があります',
      text: '保存せずに設定タブを切り替えますか？',
      showCancelButton: true,
      confirmButtonText: '切り替える',
      cancelButtonText: 'このまま編集する'
    }).then(function(result) {
      if (result.isConfirmed) {
        clearAllDirtyState_();
        performSwitchAdminTab_(id, evt);
      }
    });
  };

  window.toggleMenu = function() {
    const menu = document.getElementById('menuDropdown');
    if (menu.classList.contains('show')) { menu.classList.remove('show'); } else { menu.classList.add('show'); }
  }
  
  window.onclick = function(e) {
    if (!e.target.matches('.header-icon') && !e.target.matches('.menu-btn')) {
      var menu = document.getElementById('menuDropdown');
      if (menu && menu.classList.contains('show')) { menu.classList.remove('show'); }
    }
  }

  window.toggleDarkModeSwitch = function() {
    var toggle = document.getElementById('darkModeToggle');
    toggle.checked = !toggle.checked;
    toggleDarkMode();
  }

  window.toggleDarkMode = function() {
    document.body.classList.toggle('dark-mode');
    var isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
  };

  (function(){
    if(localStorage.getItem('theme') === 'dark'){
      document.body.classList.add('dark-mode');
      var toggle = document.getElementById('darkModeToggle');
      if(toggle) toggle.checked = true;
    }
  })();

  var loadIv;
  var processId = 0;

  window.showLoading = function(show, customText, allowCancel = false) {
    var overlay = document.getElementById('loading-overlay');
    var text = document.getElementById('loading-text');
    var cancelBtn = document.getElementById('cancel-process-btn');
    
    if (show) {
      overlay.style.display = 'block';
      cancelBtn.style.display = allowCancel ? 'inline-block' : 'none';
      
      if (customText) {
        text.innerText = customText;
        clearInterval(loadIv);
        return;
      }
      text.innerText = "AIが日報を執筆中です...\n(データ収集・生成)";
    } else {
      overlay.style.display = 'none';
      cancelBtn.style.display = 'none';
    }
  }

  window.cancelProcess = function() {
    processId++; 
    showLoading(false);
    Swal.fire({
      icon: 'info',
      title: '中止しました',
      text: '処理を中断しました。',
      timer: 1500,
      showConfirmButton: false
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function escapeAttr(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function showNetworkError(error, title) {
    const detail = error && error.message ? `\n\n詳細: ${error.message}` : '';
    Swal.fire({
      icon: 'error',
      title: title || '通信エラーが発生しました',
      text: '通信環境や連携先サービスの応答に時間がかかっている可能性があります。しばらく時間をおいてから再度お試しください。' + detail
    });
  }

  function showErrorOrNetwork(title, error) {
    if (error && error.message && error.message.indexOf('外部サービスからの応答を確認できませんでした') !== -1) {
      showNetworkError(error, title);
    } else {
      Swal.fire(title || 'エラー', error && error.message ? error.message : '不明なエラーが発生しました', 'error');
    }
  }

  /**
   * 結果表示エリアのタブを切り替えます。
   * @param {string} id 'daily' または 'summary'
   */
  window.showResTab = function(id) {
    document.querySelectorAll('.res-tab-btn').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.res-tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('btn-tab-' + id).classList.add('active');
    document.getElementById('res-' + id).classList.add('active');
  }

  /**
   * 履歴データを新しいタブで開きます。
   */
  window.openHistory = function() {
    google.script.run.withSuccessHandler(function(url) {
      if (url) window.open(url, '_blank');
      else Swal.fire('履歴なし', '履歴の保存先情報が見つかりません。\n設定をご確認ください。', 'info');

      Swal.fire('エラー', '履歴URLの取得に失敗しました: ' + e.message, 'error');
    }).getHistorySheetUrl();
  }

  window.openConnectionSettings = function() {
    switchTab('admin');
    switchAdminTab('connection');
  };

  window.openRawLogs = function() {
    google.script.run.withSuccessHandler(function(url) {
      if (url) window.open(url, '_blank');

    }).withFailureHandler(function(e) {

  /**
   * 日報作成のメイン処理を開始します。
   */
  window.toggleFixedThread = function(val) {
    var el = document.getElementById('fixedThreadConfig');
    el.style.display = (val === 'fixed_thread') ? 'block' : 'none';
  }

  window.toggleTodoFixedThread = function(val) {
    var el = document.getElementById('todoFixedThreadConfig');
    if (!el) return;
    el.style.display = (val === 'fixed_thread') ? 'block' : 'none';
  }

  window.toggleTime = function(show) {
    var el = document.getElementById('timeConfig');
    el.style.display = show ? 'block' : 'none';
  }

  window.selectHour = function(el, h) {
    var chips = document.querySelectorAll('.time-chip');
    for(var i=0; i<chips.length; i++) chips[i].classList.remove('active');
    el.classList.add('active');
    document.getElementById('scheduleHour').value = h;
  }

  window.toggleVisibility = function(id, icon) {
    var input = document.getElementById(id);
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerText = '🔓';
    } else {
      input.type = 'password';
      icon.innerText = '🔒';
    }
  }

  // ★日付のUTCズレ修正用ヘルパー
  function toLocalISOString(date) {
      const y = date.getFullYear();
      const m = ('0' + (date.getMonth() + 1)).slice(-2);
      const d = ('0' + date.getDate()).slice(-2);
      return `${y}-${m}-${d}`;
  }

  window.setQuickDate = function(offset) {
    var d = new Date();
    d.setDate(d.getDate() + offset);
    document.getElementById('manualDate').value = toLocalISOString(d);
  }

  // --- ★提案1: 未保存インジケーター機能 ---
  function setupUnsavedChangesIndicator() {
    const forms = ['connectionForm', 'settingForm', 'promptForm'];
    forms.forEach(formId => {
      const form = document.getElementById(formId);
      if (form) {
        form.addEventListener('input', () => markAsDirty(formId));
      }
    });
  }

  function markAsDirty(formId) {
    if (formId === 'connectionForm' || formId === 'settingForm') { // 複数タブにまたがるため、全保存ボタンを対象にする
      document.querySelectorAll('#connection .btn-primary, #settings .btn-primary, #reportSettingsMount .btn-primary').forEach(btn => {
        if (!btn.innerText.endsWith('*')) btn.innerText += '*';
      });
    } else if (formId === 'promptForm') {
      const saveButton = document.querySelector('#prompts .btn-primary');
      if (saveButton && !saveButton.innerText.endsWith('*')) saveButton.innerText += '*';
    }
  }
  // ------------------------------------
  
  // ★提案1の修正: 未保存インジケータークリア機能
  function clearDirtyState(formId) {
    if (formId === 'connectionForm' || formId === 'settingForm') {
      document.querySelectorAll('#connection .btn-primary, #settings .btn-primary, #reportSettingsMount .btn-primary').forEach(btn => {
        btn.innerText = btn.innerText.replace('*', '');
      });
    } else if (formId === 'promptForm') {
      const btn = document.querySelector('#prompts .btn-primary');
      if (btn) btn.innerText = btn.innerText.replace('*', '');
    }
  }

  window.discardDraft = function() {
    localStorage.removeItem('dailyReportDraft');
    document.getElementById('draftNotice').style.display = 'none';
  }

  window.addBacklogRow = function(data) {
    // ★★★ 修正: Backlogコンテナが存在しない場合は処理を中断するガード句 ★★★
    const container = document.getElementById('backlog-container');
    if (!container) return;

    data = data || {};
    var div = document.createElement('div');
    div.className = 'backlog-row';
    var keyId = 'bl_key_' + Math.random().toString(36).substr(2, 9);
    var hostId = 'bl_host_' + Math.random().toString(36).substr(2, 9);
    
    // ★★★ 修正: 削除時にDirtyマークを付け、UIを更新する ★★★
    var html = '<button type="button" class="remove-btn" onclick="this.parentElement.remove(); markAsDirty(\'connectionForm\'); updateStatusUI();">×</button>';
    html += '<input type="text" class="bl-label" placeholder="ラベル (例: 社内、〇〇様)" value="' + (data.label || '') + '">';
    html += '<input type="text" id="' + hostId + '" class="bl-host" placeholder="ホスト名 (例: g-verse.backlog.jp)" value="' + (data.host || '') + '" style="margin-top:5px;" onblur="cleanHostUrl(this)">';
    html += '<div class="input-wrapper" style="margin-top:5px;">';
    html += '<input type="password" id="' + keyId + '" class="bl-key" placeholder="API Key" value="' + (data.key || '') + '">';
    html += '<span class="toggle-password" onclick="toggleVisibility(\'' + keyId + '\', this)">🔒</span>';
    html += '</div>';
    html += '<button type="button" class="btn-test" onclick="testBacklog(this, \'' + hostId + '\', \'' + keyId + '\')">⚡ 接続テスト</button>';
    div.innerHTML = html;
    container.appendChild(div);
    
    // ★★★ 修正: 追加時にもUIを更新する ★★★
    updateStatusUI();
  }

  let isAliasFormLoading = false;

  window.addClientAliasRow = function(data, options) {
    const container = document.getElementById('client-alias-container');
    if (!container) return;

    const rowData = data || {};
    const opts = options || {};
    const expanded = typeof opts.expanded === 'boolean' ? opts.expanded : !data;
    const isEnabled = rowData.enabled !== false;
    const rowId = 'alias_' + Math.random().toString(36).substr(2, 9);
    const div = document.createElement('div');
    div.className = `backlog-row alias-rule-row${isEnabled ? '' : ' alias-disabled'}`;
    div.id = rowId;
    div.style.marginBottom = '12px';

    let html = '<div class="alias-summary-row">';
    html += `  <label class="alias-toggle-wrap" title="このルールの有効/無効を切り替えます">`;
    html += `    <input type="checkbox" class="alias-enabled-toggle" ${isEnabled ? 'checked' : ''} onchange="toggleAliasEnabled('${rowId}', this.checked); serializeAliasRules()">`;
    html += `    <span class="alias-toggle-text">${isEnabled ? '有効' : '無効'}</span>`;
    html += '  </label>';
    html += `  <span class="alias-summary-text${rowData.canonical ? '' : ' alias-summary-empty'}">${escapeHtml(rowData.canonical || '（名称未入力）')}</span>`;
    html += '  <div class="alias-tag-badges"></div>';
    html += `  <button type="button" class="btn-test alias-expand-btn" onclick="toggleAliasDetail('${rowId}')">${expanded ? '▲ 閉じる' : '▶ 編集'}</button>`;
    html += `  <button type="button" class="remove-btn alias-remove-btn" onclick="removeClientAliasRow('${rowId}')" aria-label="ルールを削除">×</button>`;
    html += '</div>';

    html += `<div class="alias-detail" style="display:${expanded ? 'block' : 'none'};">`;
    html += '  <div style="margin-bottom:8px;">';
    html += '    <label style="font-size:0.8rem; color:var(--sub-text);">正式クライアント名（canonical）</label>';
    html += `    <input type="text" class="alias-canonical" placeholder="例：A社様" value="${escapeAttr(rowData.canonical || '')}" oninput="updateAliasSummary('${rowId}'); serializeAliasRules()" style="width:100%;">`;
    html += '  </div>';

    html += buildTagInput('Slack チャンネルID', 'alias-slack-tags', rowData.slackChannels || [], 'C01ABCDEF', rowId);
    html += `  <button type="button" class="btn-test" style="font-size:0.75rem; margin-bottom:8px;" onclick="openSlackChannelSearch('${rowId}')">🔍 チャンネルIDを調べる</button>`;
    html += buildTagInput('Backlogプロジェクトキー', 'alias-backlog-tags', rowData.backlogKeys || [], 'ACME', rowId);
    html += buildTagInput('キーワード（部分一致）', 'alias-keyword-tags', rowData.keywords || [], 'A株式会社', rowId);
    html += '</div>';

    div.innerHTML = html;
    container.appendChild(div);
    updateAliasSummary(rowId);
    serializeAliasRules();
  };

  window.removeClientAliasRow = function(rowId) {
    const row = document.getElementById(rowId);
    if (!row) return;
    row.remove();
    serializeAliasRules();
  };

  window.toggleAliasEnabled = function(rowId, isEnabled) {
    const row = document.getElementById(rowId);
    if (!row) return;
    row.classList.toggle('alias-disabled', !isEnabled);
    const toggleText = row.querySelector('.alias-toggle-text');
    if (toggleText) toggleText.textContent = isEnabled ? '有効' : '無効';
    updateAliasSummary(rowId);
  };

  window.toggleAliasDetail = function(rowId, forceExpanded) {
    const row = document.getElementById(rowId);
    if (!row) return;
    const detail = row.querySelector('.alias-detail');
    const button = row.querySelector('.alias-expand-btn');
    if (!detail || !button) return;
    const isExpanded = typeof forceExpanded === 'boolean'
      ? forceExpanded
      : detail.style.display === 'none';
    detail.style.display = isExpanded ? 'block' : 'none';
    button.textContent = isExpanded ? '▲ 閉じる' : '▶ 編集';
    button.setAttribute('aria-expanded', isExpanded ? 'true' : 'false');
  };

  function buildTagInput(label, className, values, placeholder, rowId) {
    const safeValues = Array.isArray(values) ? values : [];
    return `
      <div style="margin-bottom:8px;">
        <label style="font-size:0.8rem; color:var(--sub-text);">${label}</label>
        <div class="tag-input-container ${className}" data-row="${rowId}">
          ${safeValues.map(v => `<span class="tag-pill">${escapeHtml(v)}<button type="button" onclick="removeTagPill(this, '${rowId}')">×</button></span>`).join('')}
          <input type="text" class="tag-input-field" placeholder="${placeholder}"
                 onkeydown="handleTagInputKey(event, this)" onblur="commitTagInput(this)">
        </div>
      </div>`;
  }

  function handleTagInputKey(e, input) {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      commitTagInput(input);
    }
  }

  function commitTagInput(input) {
    if (!input) return;
    const val = input.value.replace(/,/g, '').trim();
    if (!val) return;
    const tagContainer = input.parentElement;
    const rowId = (tagContainer && tagContainer.dataset && tagContainer.dataset.row)
      || input.closest('.alias-rule-row')?.id
      || '';
    const existing = getTagValues(tagContainer);
    if (existing.indexOf(val) !== -1) {
      input.value = '';
      updateAliasSummary(rowId);
      return;
    }
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.innerHTML = `${escapeHtml(val)}<button type=\"button\" onclick=\"removeTagPill(this, '${rowId}')\">×</button>`;
    tagContainer.insertBefore(pill, input);
    input.value = '';
    serializeAliasRules();
    updateAliasSummary(rowId);
  }

  function removeTagPill(btn, rowId) {
    if (!btn || !btn.parentElement) return;
    btn.parentElement.remove();
    serializeAliasRules();
    updateAliasSummary(rowId || btn.closest('.alias-rule-row')?.id || '');
  }

  function getTagValues(container) {
    if (!container) return [];
    return Array.from(container.querySelectorAll('.tag-pill'))
      .map(p => p.textContent.replace('×', '').trim())
      .filter(Boolean);
  }

  function updateAliasSummary(rowId) {
    const row = document.getElementById(rowId);
    if (!row) return;

    const canonicalInput = row.querySelector('.alias-canonical');
    const summaryText = row.querySelector('.alias-summary-text');
    const badges = row.querySelector('.alias-tag-badges');
    const canonical = canonicalInput && canonicalInput.value ? canonicalInput.value.trim() : '';
    const displayName = canonical || '（名称未入力）';
    if (summaryText) {
      summaryText.textContent = displayName;
      summaryText.classList.toggle('alias-summary-empty', !canonical);
    }

    if (!badges) return;
    const badgeItems = [
      { label: 'Slack', count: getTagValues(row.querySelector('.alias-slack-tags')).length },
      { label: 'BL', count: getTagValues(row.querySelector('.alias-backlog-tags')).length },
      { label: 'KW', count: getTagValues(row.querySelector('.alias-keyword-tags')).length }
    ].filter(item => item.count > 0);
    badges.innerHTML = badgeItems.map(item =>
      `<span class="alias-tag-badge">${item.label}:${item.count}</span>`
    ).join('');
  }

  function serializeAliasRules(skipDirty) {
    const rows = [];
    const rowEls = document.querySelectorAll('#client-alias-container .backlog-row');
    rowEls.forEach(row => {
      updateAliasSummary(row.id);
      const canonical = row.querySelector('.alias-canonical')?.value?.trim();
      if (!canonical) return;
      rows.push({
        canonical,
        enabled: row.querySelector('.alias-enabled-toggle')?.checked !== false,
        slackChannels: getTagValues(row.querySelector('.alias-slack-tags')),
        backlogKeys: getTagValues(row.querySelector('.alias-backlog-tags')).map(k => k.toUpperCase()),
        keywords: getTagValues(row.querySelector('.alias-keyword-tags'))
      });
    });
    const hidden = document.getElementById('clientAliasRules');
    const json = JSON.stringify(rows);
    if (hidden) hidden.value = json;
    if (!skipDirty && !isAliasFormLoading) {
      markAsDirty('settingForm');
    }
    return json;
  }

  window.loadAliasRulesIntoForm = function(jsonStr) {
    const container = document.getElementById('client-alias-container');
    if (!container) return;
    container.innerHTML = '';
    let rules = [];
    try {
      const parsed = JSON.parse(jsonStr || '[]');
      if (Array.isArray(parsed)) {
        rules = parsed;
      }
    } catch (e) {
      console.warn('Failed to parse client alias rules:', e);
    }

    isAliasFormLoading = true;
    if (rules.length > 0) {
      rules.forEach(rule => addClientAliasRow(rule, { expanded: false }));
    }
    isAliasFormLoading = false;
    serializeAliasRules(true);
  };

  window.openSlackChannelSearch = async function(rowId) {
    const { value: keyword } = await Swal.fire({
      title: '🔍 Slackチャンネルを検索',
      input: 'text',
      inputLabel: 'チャンネル名やキーワード',
      inputPlaceholder: '例: proj-a',
      showCancelButton: true,
      confirmButtonText: '検索',
      cancelButtonText: 'キャンセル',
      inputValidator: (value) => {
        if (!value || !value.trim()) {
          return '検索キーワードを入力してください';
        }
        return null;
      }
    });
    if (!keyword || !keyword.trim()) return;
    const query = keyword.trim();

    google.script.run
      .withSuccessHandler(function(channels) {
        if (!channels || channels.length === 0) {
          Swal.fire('見つかりません', `「${escapeHtml(query)}」に一致するチャンネルはありませんでした。`, 'info');
          return;
        }
        const options = channels.slice(0, 30).map(c =>
          `<option value=\"${c.id}\">#${escapeHtml(c.name || c.id)}（${c.id}）</option>`
        ).join('');
        Swal.fire({
          title: '検索結果',
          html: `<select id=\"found-channel-select\" class=\"swal2-select\" style=\"width:100%;\">${options}</select>`,
          showCancelButton: true,
          confirmButtonText: 'このチャンネルを追加',
          cancelButtonText: 'キャンセル',
          focusConfirm: false,
          preConfirm: () => {
            const select = document.getElementById('found-channel-select');
            if (!select || !select.value) {
              Swal.showValidationMessage('チャンネルを選択してください');
              return false;
            }
            return select.value;
          }
        }).then(result => {
          if (!result.isConfirmed || !result.value) return;
          const row = document.getElementById(rowId);
          if (!row) return;
          const tagContainer = row.querySelector('.alias-slack-tags');
          const input = tagContainer?.querySelector('.tag-input-field');
          if (!tagContainer || !input) return;
          const existing = getTagValues(tagContainer);
          if (existing.includes(result.value)) {
            Swal.fire('情報', 'このチャンネルは既に追加されています。', 'info');
            return;
          }
          input.value = result.value;
          commitTagInput(input);
        });
      })
      .withFailureHandler(function(e) {
        Swal.fire('エラー', e && e.message ? e.message : 'Slackチャンネル検索に失敗しました。', 'error');
      })
      .searchSlackChannels(query);
  };

  window.openAliasSuggestModal = function() {
    Swal.fire({
      title: '💡 クライアント候補を自動提案',
      text: 'SlackとBacklogから候補を収集中です...',
      allowOutsideClick: false,
      didOpen: () => {
        Swal.showLoading();
      }
    });

    google.script.run
      .withSuccessHandler(function(result) {
        Swal.close();
        const suggestions = result || { slack: [], backlog: [] };
        const renderSection = (title, key, items) => {
          if (!items || items.length === 0) {
            return `
              <div style="margin-bottom:16px;">
                <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;">
                  <strong>${title}</strong>
                </div>
                <div style="font-size:0.82rem; color:var(--sub-text); padding:10px 12px; border:1px dashed var(--border-color); border-radius:8px;">
                  すべてのチャンネル・プロジェクトはすでに登録済みです
                </div>
              </div>`;
          }

          const options = items.map(function(item, index) {
            const label = key === 'slack'
              ? `#${escapeHtml(item.name)}（${escapeHtml(item.id)}）`
              : `${escapeHtml(item.name)}（${escapeHtml(item.projectKey)}）`;
            return `
              <label style="display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--border-color); border-radius:8px; background:var(--card-bg); cursor:pointer;">
                <input type="checkbox" class="alias-suggest-check" data-section="${key}" data-index="${index}"
                       data-id="${escapeAttr(item.id || '')}" data-name="${escapeAttr(item.name || '')}"
                       data-project-key="${escapeAttr(item.projectKey || '')}" checked
                       style="margin-top:2px; width:18px; height:18px;">
                <span style="font-size:0.85rem; line-height:1.5;">${label}</span>
              </label>`;
          }).join('');

          return `
            <div style="margin-bottom:16px;">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:6px;">
                <strong>${title}</strong>
                <button type="button" class="btn-test alias-suggest-toggle" data-section="${key}" style="margin:0; font-size:0.75rem;">全選択</button>
              </div>
              <div style="display:flex; flex-direction:column; gap:8px; max-height:220px; overflow-y:auto;">
                ${options}
              </div>
            </div>`;
        };

        const hasAny = (suggestions.slack && suggestions.slack.length > 0) || (suggestions.backlog && suggestions.backlog.length > 0);
        Swal.fire({
          title: '💡 クライアント候補を自動提案',
          html: `
            <div style="text-align:left;">
              ${!hasAny ? `<div style="font-size:0.86rem; color:var(--sub-text); margin-bottom:12px;">すべてのチャンネル・プロジェクトはすでに登録済みです</div>` : ''}
              ${renderSection('Slack候補', 'slack', suggestions.slack || [])}
              ${renderSection('Backlog候補', 'backlog', suggestions.backlog || [])}
            </div>
          `,
          width: '680px',
          showCancelButton: true,
          confirmButtonText: '選択した候補をルールに追加',
          cancelButtonText: 'キャンセル',
          focusConfirm: false,
          didOpen: () => {
            document.querySelectorAll('.alias-suggest-toggle').forEach(function(button) {
              button.addEventListener('click', function() {
                const section = button.getAttribute('data-section');
                const boxes = Array.from(document.querySelectorAll(`.alias-suggest-check[data-section="${section}"]`));
                if (boxes.length === 0) return;
                const shouldCheckAll = boxes.some(function(box) { return !box.checked; });
                boxes.forEach(function(box) { box.checked = shouldCheckAll; });
              });
            });
          },
          preConfirm: () => {
            const checked = Array.from(document.querySelectorAll('.alias-suggest-check:checked')).map(function(box) {
              return {
                source: box.getAttribute('data-section'),
                id: box.getAttribute('data-id') || '',
                name: box.getAttribute('data-name') || '',
                projectKey: box.getAttribute('data-project-key') || ''
              };
            });
            if (checked.length === 0) {
              Swal.showValidationMessage('追加する候補を1件以上選択してください');
              return false;
            }
            return checked;
          }
        }).then(function(resultModal) {
          if (!resultModal.isConfirmed || !resultModal.value) return;

          const currentRules = JSON.parse(serializeAliasRules(true) || '[]');
          const existingSlack = {};
          const existingBacklog = {};
          currentRules.forEach(function(rule) {
            (rule.slackChannels || []).forEach(function(id) {
              if (id) existingSlack[id] = true;
            });
            (rule.backlogKeys || []).forEach(function(key) {
              if (key) existingBacklog[String(key).toUpperCase()] = true;
            });
          });

          let added = 0;
          resultModal.value.forEach(function(item) {
            if (item.source === 'slack') {
              if (existingSlack[item.id]) return;
              addClientAliasRow({
                canonical: `#${item.name}`,
                enabled: true,
                slackChannels: [item.id],
                backlogKeys: [],
                keywords: []
              }, { expanded: true });
              existingSlack[item.id] = true;
              added++;
              return;
            }
            const projectKey = (item.projectKey || '').toUpperCase();
            if (!projectKey || existingBacklog[projectKey]) return;
            addClientAliasRow({
              canonical: item.name,
              enabled: true,
              slackChannels: [],
              backlogKeys: [projectKey],
              keywords: []
            }, { expanded: true });
            existingBacklog[projectKey] = true;
            added++;
          });

          if (added === 0) {
            Swal.fire('情報', '選択した候補はすでに画面上のルールに追加されています。', 'info');
            return;
          }
          serializeAliasRules();
          Swal.fire('追加完了', `${added}件の候補をルールに追加しました。`, 'success');
        });
      })
      .withFailureHandler(function(e) {
        Swal.close();
        Swal.fire('エラー', e && e.message ? e.message : '候補の取得に失敗しました。', 'error');
      })
      .suggestClientAliasRules();
  };

  window.openAliasTestModal = async function() {
    const rulesJson = serializeAliasRules(true) || '[]';
    const fallbackName = document.getElementById('clientFallbackName')?.value?.trim() || '● その他';

    const renderAutoTestResults = function(results) {
      const container = document.getElementById('auto-test-result');
      if (!container) return;
      container.style.display = 'block';
      if (!results || results.length === 0) {
        container.innerHTML = '<div style="color:var(--sub-text);">直近3日分のSlack/Backlogからテスト対象が見つかりませんでした。</div>';
        return;
      }

      const unmatchedCount = results.filter(function(item) { return !item.matched; }).length;
      container.innerHTML = results.map(function(item) {
        const status = item.matched
          ? `<div style="color:#1f8a4c; font-weight:700;">✅ ${escapeHtml(item.matched)}</div>`
          : `<div style="color:#c77d00; font-weight:700;">⚠️ 未分類（フォールバック）</div>`;
        const sourceLabel = item.source === 'slack' ? 'Slack' : 'Backlog';
        return `
          <div style="padding:8px 0; border-bottom:1px solid var(--border-color);">
            <div style="display:flex; justify-content:space-between; gap:8px; font-size:0.74rem; color:var(--sub-text); margin-bottom:4px;">
              <span>${sourceLabel}</span>
              <span>${escapeHtml(item.label || '')}</span>
            </div>
            ${status}
            <div style="font-size:0.8rem; margin-top:4px; line-height:1.5;">${escapeHtml(item.excerpt || '')}</div>
          </div>`;
      }).join('') + `<div style="padding-top:8px; font-size:0.8rem; font-weight:700;">未分類 ${unmatchedCount}件 / 全体 ${results.length}件</div>`;
    };

    const { value: formValues } = await Swal.fire({
      title: '🔍 マッチテスト',
      html: `
        <button id="auto-test-btn" type="button"
                style="width:100%; margin-bottom:12px; padding:10px 12px; background:var(--accent);
                       color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:0.85rem; font-weight:700;">
          🤖 実データで自動テスト（過去3日間）
        </button>
        <div id="auto-test-result" style="display:none; text-align:left; max-height:240px;
             overflow-y:auto; border:1px solid #ddd; border-radius:8px; padding:8px; margin-bottom:12px;
             font-size:0.8rem; background:var(--card-bg);"></div>
        <div style="text-align:left; font-size:0.85rem; color:#666; margin-bottom:8px;">
          テストしたいテキストを入力し、名寄せ結果を確認できます。
        </div>
        <select id="test-source-type" class="swal2-select" style="width:100%; margin-bottom:8px;">
          <option value="other" selected>汎用（テキストのみ）</option>
          <option value="slack">Slack</option>
          <option value="backlog">Backlog</option>
        </select>
        <input id="test-channel-id" class="swal2-input" placeholder="Slack チャンネルID (例: C01ABCDEF)" style="display:none;">
        <input id="test-project-key" class="swal2-input" placeholder="Backlogプロジェクトキー (例: ACME)" style="display:none;">
        <textarea id="test-input-text" class="swal2-textarea" placeholder="マッチさせたいタイトル・本文など" rows="4"></textarea>
      `,
      showCancelButton: true,
      confirmButtonText: 'マッチ確認',
      cancelButtonText: 'キャンセル',
      focusConfirm: false,
      allowOutsideClick: () => !Swal.isLoading(),
      didOpen: () => {
        const select = document.getElementById('test-source-type');
        const channelInput = document.getElementById('test-channel-id');
        const projectInput = document.getElementById('test-project-key');
        const autoTestButton = document.getElementById('auto-test-btn');
        const toggleInputs = () => {
          channelInput.style.display = select.value === 'slack' ? '' : 'none';
          projectInput.style.display = select.value === 'backlog' ? '' : 'none';
        };
        const runAutoTest = () => {
          const latestRulesJson = serializeAliasRules(true) || '[]';
          autoTestButton.disabled = true;
          Swal.showLoading();
          google.script.run
            .withSuccessHandler(function(results) {
              Swal.hideLoading();
              autoTestButton.disabled = false;
              renderAutoTestResults(results || []);
            })
            .withFailureHandler(function(e) {
              Swal.hideLoading();
              autoTestButton.disabled = false;
              Swal.fire('エラー', e && e.message ? e.message : '自動テストに失敗しました。', 'error');
            })
            .runClientAliasAutoTest(latestRulesJson);
        };
        select.addEventListener('change', toggleInputs);
        autoTestButton.addEventListener('click', runAutoTest);
        toggleInputs();
      },
      preConfirm: () => {
        const sourceType = document.getElementById('test-source-type').value;
        const channelId = document.getElementById('test-channel-id').value.trim();
        const projectKey = document.getElementById('test-project-key').value.trim().toUpperCase();
        const text = document.getElementById('test-input-text').value.trim();
        if (sourceType === 'slack' && !channelId) {
          Swal.showValidationMessage('Slackを選択した場合、チャンネルIDを入力してください');
          return false;
        }
        if (sourceType === 'backlog' && !projectKey) {
          Swal.showValidationMessage('Backlogを選択した場合、プロジェクトキーを入力してください');
          return false;
        }
        if (!text && sourceType === 'other') {
          Swal.showValidationMessage('テキストを入力してください');
          return false;
        }
        return { sourceType, channelId, projectKey, text };
      }
    });

    if (!formValues) return;

    google.script.run
      .withSuccessHandler(function(result) {
        const ruleIndex = typeof result.ruleIndex === 'number' ? result.ruleIndex : -1;
        const matchedName = result.matched || fallbackName;
        const message = ruleIndex >= 0
          ? `✅ ルール ${ruleIndex + 1}「${escapeHtml(matchedName)}」にマッチしました`
          : `⚠️ マッチするルールがなく、フォールバック「${escapeHtml(matchedName)}」に分類されます`;
        Swal.fire('テスト結果', message, ruleIndex >= 0 ? 'success' : 'warning');
      })
      .withFailureHandler(function(e) {
        Swal.fire('エラー', e && e.message ? e.message : 'マッチテストに失敗しました。', 'error');
      })
      .testClientAliasMatch(rulesJson, formValues);
  };

/**
 * AIが生成したMarkdownテーブルの構造を修正します。
 * @param {string} text AIが生成したテキスト
 * @returns {string} 修正後のテキスト
 */
function fixTableStructure(text) {
  // 1. 見出しとテーブルの間に空行を強制挿入
  text = text.replace(/(▼[^\n]+)\n(\s*)(\|[^\n]+\|)/g, '$1\n\n$3');
  
  // 2. 4列テーブルを3列に修正（最初の列を削除）
  const lines = text.split('\n');
  const fixedLines = lines.map(line => {
    // テーブル行を検出（4つ以上のパイプを含む）
    if (line.trim().match(/^\|[^|]+\|[^|]+\|[^|]+\|[^|]+\|/)) {
      // 最初のデータ列を削除
      return line.replace(/^(\s*\|)[^|]+(\s*\|)/, '$1');
    }
    return line;
  });
  return fixedLines.join('\n');
}

function extractChartDataFromSummaryTable(text) {
  if (!text) return null;
  const src = String(text);
  const lines = src.split('\n');
  const map = {};
  let foundHeader = false;

  // できる限り「プロジェクト別サマリ」セクションを優先して読む
  const summaryHeadingIdx = lines.findIndex(function(line) {
    return /プロジェクト別サマリ/.test(line);
  });
  const targetLines = summaryHeadingIdx >= 0 ? lines.slice(summaryHeadingIdx) : lines;

  for (let i = 0; i < targetLines.length; i++) {
    const line = (targetLines[i] || '').trim();
    if (!line) continue;
    // 日別ブロックに入ったら打ち切る
    if (/^▼\s*\d{4}\/\d{2}\/\d{2}/.test(line) || /日別・工数入力データ/.test(line)) break;
    if (!line.startsWith('|')) continue;
    if (line.indexOf('プロジェクト') !== -1 || line.indexOf('種別') !== -1) {
      foundHeader = true;
      continue;
    }
    if (/^\|\s*:?-{2,}:?\s*\|/.test(line) || /^\|\s*-{2,}/.test(line)) continue;
    const cells = line.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
    if (cells.length < 2) continue;
    const label = (cells[0] || '').replace(/\*\*/g, '').trim();
    if (!label) continue;
    const hourMatch = String(cells[1] || '').match(/-?\d+(?:\.\d+)?/);
    if (!hourMatch) continue;
    const hours = Number(hourMatch[0]);
    if (!Number.isFinite(hours) || hours <= 0) continue;
    map[label] = (map[label] || 0) + hours;
  }

  const data = Object.keys(map).map(function(label) {
    return { label: label, hours: map[label] };
  });
  if (!data.length && !foundHeader) return null;
  if (!data.length) return null;
  data.sort(function(a, b) { return b.hours - a.hours; });
  return data;
}

function buildSummaryFromDailyText(dailyText) {
  if (!dailyText) return null;
  const lines = String(dailyText).split('\n');
  const map = {};
  for (let i = 0; i < lines.length; i++) {
    const line = (lines[i] || '').trim();
    if (!line.startsWith('|')) continue;
    if (line.indexOf('種別') !== -1 || /^\|\s*:?-{2,}:?\s*\|/.test(line) || /^\|\s*-{2,}/.test(line)) continue;
    const cells = line.split('|').map(function(s){ return s.trim(); }).filter(Boolean);
    if (cells.length < 2) continue;
    const label = (cells[0] || '').replace(/\*\*/g, '').trim();
    if (!label) continue;
    const hourMatch = String(cells[1] || '').match(/-?\d+(?:\.\d+)?/);
    if (!hourMatch) continue;
    const hours = Number(hourMatch[0]);
    if (!Number.isFinite(hours) || hours <= 0) continue;
    map[label] = (map[label] || 0) + hours;
  }
  const rows = Object.keys(map).map(function(label) { return { label: label, hours: map[label] }; });
  if (!rows.length) return null;
  rows.sort(function(a, b) { return b.hours - a.hours; });
  const total = rows.reduce(function(acc, r){ return acc + r.hours; }, 0);
  const md = [
    '📊 **プロジェクト別サマリ（再構築）**',
    '',
    '| プロジェクト | 合計時間 |',
    '|---|---:|'
  ];
  rows.forEach(function(r) {
    md.push('| ' + r.label + ' | ' + r.hours.toFixed(1) + 'h |');
  });
  md.push('');
  md.push('💰 合計: ' + total.toFixed(1) + '時間');
  return { markdown: md.join('\n'), chartData: rows };
}
  function renderAggResult(fullText) {
    console.log("Raw Response:", fullText);

    // 1. JSON抽出 (かなり緩く探す)
    var jsonMatch = fullText.match(/```(?:json)?\s*(\[\s*\{[\s\S]*?\}\s*\])\s*```/);
    if (!jsonMatch) {
          // コードブロックがない場合、直書きのJSON配列を探す
          jsonMatch = fullText.match(/(\[\s*\{[\s\S]*?\}\s*\])/);
    }

    var chartData = null;
    var summaryText = fullText;

    if (jsonMatch && jsonMatch[1]) {
        try {
            chartData = JSON.parse(jsonMatch[1]);
            // 工数の多い順（降順）にソート
            chartData.sort(function(a, b) { return b.hours - a.hours; });
            // 本文からJSON部分を削除して見やすくする
            summaryText = fullText.replace(jsonMatch[0], '');
        } catch(e) {
            console.error("JSON Parse Error:", e);
        }
    }
    // 2. 日別データの分割（表記ゆれに強いロジック）
    var baseText = summaryText;
    var dailyText = "";
    var splitStart = -1;
    var splitPatterns = [
      /(?:^|\n)\s*📅\s*\*{0,2}\s*日別/m,
      /(?:^|\n)\s*(?:#+\s*)?日別・工数入力データ/m,
      /(?:^|\n)\s*(?:#+\s*)?日別データ/m,
      /(?:^|\n)\s*[-]{5,}\s*\n\s*📅/m,
      /(?:^|\n)\s*▼\s*\d{4}\/\d{2}\/\d{2}/m
    ];

    for (var i = 0; i < splitPatterns.length; i++) {
      var m = splitPatterns[i].exec(baseText);
      if (m && typeof m.index === 'number') {
        splitStart = m.index + (m[0].startsWith('\n') ? 1 : 0);
        break;
      }
    }

    if (splitStart >= 0) {
      summaryText = baseText.slice(0, splitStart).trim();
      dailyText = baseText.slice(splitStart).trim();
    } else {
      // 分割不可でもUIを壊さない:
      // サマリ/日別の両方に本文を表示して確認可能にする
      summaryText = baseText.trim();
      dailyText = baseText.trim();
    }

    // ★★★ 修正: フロントエンドでの検証とフォールバック (aggregation-table-fix.md) ★★★
    dailyText = fixTableStructure(dailyText); // 4列テーブルなどを修正

    // 空のテーブル行を削除
    dailyText = dailyText.replace(/^\s*\|(\s*\|)+\s*$/gm, '');

    // テーブルが全く生成されていない場合のエラーハンドリング
    if (!dailyText.includes('|---|')) {
      dailyText = "⚠️ テーブル形式での表示に失敗しました。\n\n---\n" + dailyText;
    }
    // ★★★ 修正ここまで ★★★    
    if (!chartData) {
      chartData = extractChartDataFromSummaryTable(summaryText);
    }
    if (!summaryText || !summaryText.trim()) {
      const rebuilt = buildSummaryFromDailyText(dailyText);
      if (rebuilt) {
        summaryText = rebuilt.markdown;
        if (!chartData) chartData = rebuilt.chartData;
      } else {
        summaryText = "（サマリを抽出・再構築できませんでした。日別タブを参照してください）";
      }
    }
    
    // 3. 表示実行
    document.getElementById('aggSummaryText').innerHTML = marked.parse(summaryText);
    document.getElementById('aggDailyText').innerHTML = marked.parse(dailyText);
    window.lastAggText = dailyText;
    window.lastAggJson = chartData; // 修正指示機能とチャートクリック機能用

    // ★修正: 結果エリアを表示し、強制的に「日別データ」タブをアクティブにする
    var resArea = document.getElementById('agg-result-area');
    resArea.style.display = 'block';
    
    // ★ここを変更: 強制的に「日別」タブをクリックさせる
    document.getElementById('btn-tab-daily').click();

    // グラフ描画
    if (chartData) {
        setTimeout(function(){ renderAggChart(chartData, 'label'); }, 200);
    } else {
        document.getElementById('aggChart').style.display = 'none';
    }
    
    // スクロール
    setTimeout(function(){ resArea.scrollIntoView({behavior:'smooth', block:'start'}); }, 300);
  }

  function highlightProjectInData(projectName) {

      dailyContainer.querySelectorAll('li').forEach(li => li.style.backgroundColor = '');

      // 該当するプロジェクト名を含むli要素を探してハイライト（レガシー形式）
      dailyContainer.querySelectorAll('li').forEach(li => {
          if (li.textContent.includes(`[${projectName}]`) || li.textContent.includes(projectName)) {
              li.style.backgroundColor = 'var(--highlight)';
          }
      });
      // テーブル形式の場合、該当行をハイライト
      dailyContainer.querySelectorAll('tr').forEach(tr => {
          if (tr.textContent.includes(projectName)) {
              tr.style.backgroundColor = 'var(--highlight)';

      });

  window.copyDailyResult = function() {
      var txt = window.lastAggText || "";
      // Markdown記号を消してコピーしやすく

  // --- ★提案3: 設定のインポート/エクスポート ---
  function collectAllSettings() {
    const form = document.getElementById('connectionForm');
    const settingsForm = document.getElementById('settingForm');
    const promptForm = document.getElementById('promptForm');

    const formData = new FormData(form);
    const settingsFormData = new FormData(settingsForm);
    for (const [key, value] of settingsFormData.entries()) { formData.append(key, value); }
    const promptFormData = new FormData(promptForm);
    for (const [key, value] of promptFormData.entries()) { formData.append(key, value); }

    const data = Object.fromEntries(formData.entries());

    // Checkboxes and other manual data
    data.scheduleEnable = document.querySelector('input[name="scheduleEnable"]:checked')?.value || 'off';
    data.scheduleDays = Array.from(document.querySelectorAll('.day-checkbox:checked')).map(cb => cb.value);
    data.skipHolidays = document.getElementById('skipHolidays').checked;

    data.todoNotifyEnable = document.querySelector('input[name="todoNotifyEnable"]:checked')?.value || 'off';
    data.todoNotifyTime = document.getElementById('todoNotifyTime')?.value || '09:00';
    data.todoNotifyDays = Array.from(document.querySelectorAll('.todo-day-checkbox:checked')).map(cb => cb.value);
    data.todoSkipHolidays = document.getElementById('todoSkipHolidays')?.checked || false;
    data.todoSlackStyle = document.getElementById('todoSlackStyle')?.value || 'direct';
    data.todoFixedThreadUrl = document.getElementById('todoFixedThreadUrl')?.value?.trim() || '';
    // prompt textarea は name 属性がないため、明示的に収集する
    data.promptSummary = document.getElementById('promptSummary')?.value || '';
    data.promptManhour = document.getElementById('promptManhour')?.value || '';
    data.promptReflection = document.getElementById('promptReflection')?.value || '';
    data.promptAggregation = document.getElementById('promptAggregation')?.value || '';

    const blConfigs = [];
    document.querySelectorAll('#backlog-container .backlog-row').forEach(row => {
      blConfigs.push({
        label: row.querySelector('.bl-label').value,
        host: row.querySelector('.bl-host').value,
        key: row.querySelector('.bl-key').value
      });
    });
    data.backlogConfigs = blConfigs;

    // 部署選択（run タブ内のため FormData に含まれない）
    data.selectedDepartment = 'CS';

    // クライアント名寄せ辞書（フォーム外にあるため手動取得）
    serializeAliasRules(true);
    const aliasHidden = document.getElementById('clientAliasRules');
    const aliasError = document.getElementById('alias-error');
    data.clientAliasRules = aliasHidden?.value || '[]';
    if (data.clientAliasRules) {
      try {
        JSON.parse(data.clientAliasRules);
        if (aliasError) {
          aliasError.style.display = 'none';
          aliasError.textContent = '';
        }
      } catch (e) {
        if (aliasError) {
          aliasError.textContent = '⚠️ 名寄せルールのデータが壊れています。再設定してください。';
          aliasError.style.display = 'block';
        }
        return null;
      }
    }

    data.clientFallbackName = document.getElementById('clientFallbackName')?.value?.trim() || '● その他';
    data.reportSlackHousekeeping = document.getElementById('reportSlackHousekeeping')?.checked ? 'on' : 'off';

    return data;
  }

  function exportSettings() {
      const data = collectAllSettings();
      if (!data) return;
      // セキュリティ: Backlog APIキーをエクスポートから除外
      if (data.backlogConfigs) {
        data.backlogConfigs = data.backlogConfigs.map(function(c) {
          return { label: c.label, host: c.host };
        });
      }
      const jsonString = JSON.stringify(data, null, 2);
      const blob = new Blob([jsonString], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'geminippo-settings.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
  }

  window.importSettings = function() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = e => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = readerEvent => {
              try {
                  const content = readerEvent.target.result;
                  const settings = JSON.parse(content);
                  applySettingsToForm(settings);
                  Swal.fire('インポート完了', '設定をフォームに反映しました。\n内容を確認し、接続設定・日報設定・TODO設定・プロンプト設定を保存してください。', 'success');
              } catch (err) {
                  Swal.fire('インポート失敗', 'ファイルの形式が正しくないか、読み込みに失敗しました。', 'error');
              }
          };
          reader.readAsText(file, 'UTF-8');
      };
      input.click();
  }

  function applySettingsToForm(settings) {
    // この関数は、settingsオブジェクトのキーと値を使って、各フォーム要素に値を設定するロジックを実装します。
    // 例: document.getElementById('slackId').value = settings.slackId;
    // ★★★ 修正: 汎用的なフォーム適用ロジックに改善 ★★★
    Object.keys(settings).forEach(key => {
      const value = settings[key];
      const el = document.getElementById(key) || document.querySelector(`[name="${key}"]`);

      if (!el) return;

      if (el.type === 'checkbox') {
        if (typeof value === 'string') {
          el.checked = (value === 'on' || value === 'true' || value === '1');
        } else {
          el.checked = !!value;
        }
      } else if (el.type === 'radio') {
        // name属性でラジオボタングループを探して、該当するvalueを持つものをチェック
        document.querySelectorAll(`input[name="${key}"]`).forEach(rb => {
          rb.checked = (rb.value === String(value));
        });
      } else {
        el.value = value;
      }
    });

    // スケジュール有効/無効
    if (settings.scheduleEnable) {
      const radio = document.querySelector(`input[name="scheduleEnable"][value="${settings.scheduleEnable}"]`);
      if(radio) {
        radio.checked = true;
        toggleTime(settings.scheduleEnable === 'on');
      }
    }
    // 曜日
    document.querySelectorAll('.day-checkbox').forEach(cb => cb.checked = false);
    if (settings.scheduleDays && Array.isArray(settings.scheduleDays)) {
      settings.scheduleDays.forEach(day => {
        const cb = document.getElementById(`day_${day}`);
        if (cb) cb.checked = true;
      });
    }

    if (settings.backlogConfigs && Array.isArray(settings.backlogConfigs)) {
        document.getElementById('backlog-container').innerHTML = '';
        settings.backlogConfigs.forEach(c => addBacklogRow(c));
    }

    const aliasJson = settings.clientAliasRules || settings.CLIENT_ALIAS_RULES;
    if (aliasJson) {
      loadAliasRulesIntoForm(aliasJson);
    }
    const fallbackName = settings.clientFallbackName || settings.CLIENT_FALLBACK_NAME;
    if (fallbackName) {
      const fallbackInput = document.getElementById('clientFallbackName');
      if (fallbackInput) fallbackInput.value = fallbackName;
    }

    const todoEnable = settings.todoNotifyEnable || settings.TODO_NOTIFY_ENABLE;
    if (todoEnable) {
      const radio = document.querySelector(`input[name="todoNotifyEnable"][value="${todoEnable}"]`);
      if (radio) {
        radio.checked = true;
        toggleTodoTime(todoEnable === 'on');
      }
    }
    const todoTime = settings.todoNotifyTime || settings.TODO_NOTIFY_TIME;
    if (document.getElementById('todoNotifyTime')) {
      document.getElementById('todoNotifyTime').value = (todoTime && todoTime !== 'off') ? todoTime : '09:00';
    }
    const todoSlackStyle = settings.todoSlackStyle || settings.TODO_SLACK_STYLE || 'direct';
    const todoSlackStyleEl = document.getElementById('todoSlackStyle');
    if (todoSlackStyleEl) {
      todoSlackStyleEl.value = todoSlackStyle;
      toggleTodoFixedThread(todoSlackStyle);
    }

  window.runTodaysTodo = function() {
    showLoading(true, '今日のTODOを収集・生成中...', false);
    google.script.run
      .withSuccessHandler(function(res) {
        showLoading(false);
        const box = document.getElementById('todoResult');
        const actionArea = document.getElementById('todoActionArea');
        const warningBox = document.getElementById('todoWarnings');
        warningBox.style.display = 'none';
        warningBox.innerHTML = '';
        if (res.success) {
          if (res.message) {
            latestTodoMessage = res.message;
            box.style.display = 'block';
            google.script.run
              .withSuccessHandler(function(ruleData) {
                todoReminderStateMap = buildTodoReminderStateMap(ruleData);
                box.innerHTML = marked.parse(prettifyTodoLinks(res.message));
              })
              .withFailureHandler(function() {
                todoReminderStateMap = {};
                box.innerHTML = marked.parse(prettifyTodoLinks(res.message));
              })
              .listTodoReminderRules();
            if (actionArea) actionArea.style.display = 'block';
          }
          if (res.warnings && res.warnings.length > 0) {
            warningBox.style.display = 'block';
            warningBox.innerHTML = '<strong>⚠️ 取得できなかったデータ</strong><ul>' +
              res.warnings.map(function(w) { return '<li>' + escapeHtml(w) + '</li>'; }).join('') +
              '</ul>';
          }
        } else {
          latestTodoMessage = '';
          box.style.display = 'none';
          if (actionArea) actionArea.style.display = 'none';
          warningBox.style.display = 'none';
          Swal.fire('エラー', res.message, 'error');
        }
      })
      .withFailureHandler(function(e) {
        showLoading(false);
        latestTodoMessage = '';
        const warningBox = document.getElementById('todoWarnings');
        const actionArea = document.getElementById('todoActionArea');
        if (actionArea) actionArea.style.display = 'none';
        if (warningBox) { warningBox.style.display = 'none'; warningBox.innerHTML = ''; }
        showErrorOrNetwork('実行エラー', e);
      })
      .sendTodaysTodoNotification();
  };

  function prettifyTodoLinks(text) {
    if (!text) return '';
    return text.replace(/<!--REM:(https?:\/\/[^|>]+)\|([^>]+)-->/g, function(_, url, labelEnc) {
      const label = decodeURIComponent(labelEnc || '');
      const state = todoReminderStateMap[url] || 'none';
      const isMuted = (state === 'muted');
      const btnClass = isMuted
        ? (document.body.classList.contains('dark-mode')
            ? 'border-color:#34a853; color:#9ff3b0; background:#1f3b2a;'
            : 'border-color:#1e8e3e; color:#1e8e3e; background:#e6f4ea;')
        : '';
      const nextState = isMuted ? 'none' : 'muted';
      const icon = isMuted ? '🔕' : '🔔';
      const title = isMuted ? '通知を再開' : '通知しない';
      return `<span style="margin-left:8px; display:inline-flex; gap:6px;">
        <button type="button" class="btn-test" title="${title}" style="margin-top:0; font-size:12px; padding:3px 8px; ${btnClass}" onclick="setTodoReminderState('${escapeAttr(url)}','${escapeAttr(label)}','${nextState}', this)">${icon}</button>
      </span>`;
    });
  }

  function buildTodoReminderStateMap(ruleData) {
    const map = {};
    const muted = (ruleData && Array.isArray(ruleData.muted)) ? ruleData.muted : [];
    const checked = (ruleData && Array.isArray(ruleData.checked)) ? ruleData.checked : [];
    muted.forEach(function(item) { if (item && item.url) map[item.url] = 'muted'; });
    checked.forEach(function(item) { if (item && item.url) map[item.url] = 'checked'; });
    return map;
  }

  window.setTodoReminderState = function(url, label, state, btnEl) {
    if (!url) return;
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.success) {
          todoReminderStateMap[url] = state;
          const box = document.getElementById('todoResult');
          if (box && latestTodoMessage) {
            box.innerHTML = marked.parse(prettifyTodoLinks(latestTodoMessage));
          }
          loadTodoReminderRules();
        } else {
          Swal.fire('更新失敗', (res && res.message) || '状態更新に失敗しました。', 'error');
        }
      })
      .withFailureHandler(function(e) {
        Swal.fire('更新失敗', e && e.message ? e.message : '状態更新に失敗しました。', 'error');
      })
      .setTodoReminderState(url, label || '', state);
  };

  window.loadTodoReminderRules = function() {
    const el = document.getElementById('todoRuleList');
    if (!el) return;
    el.innerHTML = '読込中...';
    google.script.run
      .withSuccessHandler(function(ruleData) {
        const muted = (ruleData && Array.isArray(ruleData.muted)) ? ruleData.muted : [];
        const checked = (ruleData && Array.isArray(ruleData.checked)) ? ruleData.checked : [];
        const rows = [];
        muted.forEach(function(item) {
          rows.push(`<div style="margin-bottom:6px;"><strong>🔕 ミュート</strong> ${escapeHtml(item.label || item.url)} <button type="button" class="btn-test" style="margin-top:0; font-size:11px;" onclick="clearTodoReminderRule('${escapeAttr(item.url)}')">解除</button></div>`);
        });
        checked.forEach(function(item) {
          rows.push(`<div style="margin-bottom:6px;"><strong>✅ チェック済み</strong> ${escapeHtml(item.label || item.url)} <button type="button" class="btn-test" style="margin-top:0; font-size:11px;" onclick="clearTodoReminderRule('${escapeAttr(item.url)}')">解除</button></div>`);
        });
        el.innerHTML = rows.length ? rows.join('') : '登録済みルールはありません。';
      })
      .withFailureHandler(function() {
        el.innerHTML = 'ルールの読み込みに失敗しました。';
      })
      .listTodoReminderRules();
  };

  window.clearTodoReminderRule = function(url) {
    if (!url) return;
    google.script.run
      .withSuccessHandler(function() {
        delete todoReminderStateMap[url];
        if (latestTodoMessage) {
          const box = document.getElementById('todoResult');
          if (box) box.innerHTML = marked.parse(prettifyTodoLinks(latestTodoMessage));
        }
        loadTodoReminderRules();
      })
      .withFailureHandler(function(e) {
        Swal.fire('解除失敗', e && e.message ? e.message : '解除に失敗しました。', 'error');
      })
      .setTodoReminderState(url, '', 'none');
  };

  window.sendDisplayedTodoToSlack = function() {

  window.saveTodoSettings = function() {
    const enable = document.querySelector('input[name="todoNotifyEnable"]:checked')?.value || 'off';
    const time = document.getElementById('todoNotifyTime').value || '09:00';
    const days = Array.from(document.querySelectorAll('.todo-day-checkbox:checked')).map(cb => cb.value);
    const todoSkipHolidays = document.getElementById('todoSkipHolidays')?.checked || false;
    const todoSlackStyle = document.getElementById('todoSlackStyle')?.value || 'direct';
    const todoFixedThreadUrl = document.getElementById('todoFixedThreadUrl')?.value?.trim() || '';

    showLoading(true, '通知設定を保存しています...', false);
    google.script.run
      .withSuccessHandler(function(res) {
        showLoading(false);
        refreshSettingsFromServer_();
        Swal.fire({ icon: 'success', title: '保存しました', timer: 1500, showConfirmButton: false });
      })
      .withFailureHandler(function(e) {
        showLoading(false);
        Swal.fire('保存エラー', e.message, 'error');
      })
      .saveTodoSettings({
        todoNotifyEnable: enable,
        todoNotifyTime: time,
        todoNotifyDays: days,
        todoSkipHolidays: todoSkipHolidays,
        todoSlackStyle: todoSlackStyle,
        todoFixedThreadUrl: todoFixedThreadUrl
      });
  };

  function refreshSettingsFromServer_() {
    google.script.run
      .withSuccessHandler(function(serverSettings) {
        if (serverSettings) applySettingsToForm(serverSettings);
      })
      .withFailureHandler(function() {})
      .getUserSettings();
  }
